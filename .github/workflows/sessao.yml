name: Presidente da Sessão
on:
  pull_request:
    paths:
      - 'apps/sessao/**'
      - 'packages/hud/**'
      - '.github/workflows/sessao.yml'
  push:
    branches: [main]
    paths:
      - 'apps/sessao/**'
      - 'packages/hud/**'
      - '.github/workflows/sessao.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sessao
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        flow: [security-layout, market]
    env:
      SMOKE_FLOW: ${{ matrix.flow }}
    defaults:
      run:
        working-directory: apps/sessao
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install headless Chromium
        run: npx --yes --package=@playwright/cli@0.1.24 playwright-cli install-browser chrome-for-testing --with-deps
      - name: Verify the HUD against a local game server
        run: |
          set -euo pipefail
          browser() { npx --yes --package=@playwright/cli@0.1.24 playwright-cli -s="sessao-$SMOKE_FLOW-ci" "$@"; }
          PORT=26874 SESSAO_LOCAL_SOLO=1 bun "dev/$SMOKE_FLOW-smoke-server.ts" &
          server_pid=$!
          VITE_GAME_SERVER=http://127.0.0.1:26874 bun node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5194 --strictPort &
          client_pid=$!
          cleanup() {
            browser close || true
            kill "$server_pid" "$client_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:26874/health
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:5194/ >/dev/null
          browser open http://127.0.0.1:5194 --browser chrome-for-testing --config dev/private-call-chrome.json
          browser run-code --filename "dev/$SMOKE_FLOW-smoke.js" --json
