name: Presidente da Sessão
on:
  pull_request:
    paths:
      - 'apps/sessao/**'
      - 'packages/hud/**'
      - '.github/workflows/sessao.yml'
  push:
    branches: [main]
    paths:
      - 'apps/sessao/**'
      - 'packages/hud/**'
      - '.github/workflows/sessao.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sessao
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        flow:
          - security-layout
          - market
          - vote-history
          - megaphone-speech
          - campaign-tv
          - attributes
          - reward
          - phone-pix
          - legislative-modals
          - context-overflow
          - context-progress
          - exploration-hud
    env:
      SMOKE_FLOW: ${{ matrix.flow }}
    defaults:
      run:
        working-directory: apps/sessao
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install headless Chromium
        run: npx --yes --package=@playwright/cli@0.1.24 playwright-cli install-browser chrome-for-testing --with-deps
      - name: Run a game flow in Chrome
        run: |
          set -euo pipefail
          browser() { npx --yes --package=@playwright/cli@0.1.24 playwright-cli -s="sessao-$SMOKE_FLOW-ci" "$@"; }
          VITE_GAME_SERVER=http://127.0.0.1:26874 bun node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5194 --strictPort &
          client_pid=$!
          pids=("$client_pid")
          cleanup() {
            browser close || true
            kill "${pids[@]}" 2>/dev/null || true
          }
          trap cleanup EXIT
          server_fixture="$SMOKE_FLOW"
          if [[ "$SMOKE_FLOW" == megaphone-speech ]]; then server_fixture=market; fi
          server_entry="dev/$server_fixture-smoke-server.ts"
          flows=("$SMOKE_FLOW")
          if [[ "$SMOKE_FLOW" == exploration-hud ]]; then
            server_entry=server/index.ts
            flows=(room-entrance asset-loading hud-help action-shortcuts floor-plan phone-apps)
          fi
          PORT=26874 SESSAO_LOCAL_SOLO=1 bun "$server_entry" &
          pids+=("$!")
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:26874/health
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:5194/ >/dev/null
          url=http://127.0.0.1:5194
          if [[ "$SMOKE_FLOW" == megaphone-speech ]]; then
            url="$url/?captureVoice=1"
          fi
          diagnostics=/tmp/sessao-smoke-failures
          mkdir -p "$diagnostics"
          for flow in "${flows[@]}"; do
            browser open "$url" --browser chrome-for-testing --config dev/private-call-chrome.json
            log="$diagnostics/$flow.json"
            if browser run-code --filename "dev/$flow-smoke.js" --json 2>&1 | tee "$log"; then
              rm "$log"
            else
              status=$?
              browser screenshot --filename "$diagnostics/$flow.png" || true
              exit "$status"
            fi
            browser close
          done
      - name: Keep browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ matrix.flow }}
          path: /tmp/sessao-smoke-failures/
      - name: Keep exploration HUD screenshots
        if: matrix.flow == 'exploration-hud'
        uses: actions/upload-artifact@v4
        with:
          name: exploration-hud-screenshots
          path: /tmp/sessao-exploration-*.png
          if-no-files-found: error
      - name: Keep full ballot screenshots
        if: matrix.flow == 'vote-history'
        uses: actions/upload-artifact@v4
        with:
          name: full-ballot-screenshots
          path: /tmp/sessao-ballot-*.png
          if-no-files-found: error
      - name: Keep the received megaphone clips
        if: matrix.flow == 'megaphone-speech'
        uses: actions/upload-artifact@v4
        with:
          name: megaphone-received-audio
          path: /tmp/sessao-megaphone-*.webm
          if-no-files-found: error
