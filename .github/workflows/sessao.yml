name: Presidente da Sessão
on:
  pull_request:
    paths:
      - 'apps/sessao/**'
      - '.github/workflows/sessao.yml'
  push:
    branches: [main]
    paths:
      - 'apps/sessao/**'
      - '.github/workflows/sessao.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sessao
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
