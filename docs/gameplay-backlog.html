","main.ts, match-hud.tsx, hud.tsx, theme.css, progression-hud.tsx, rts-hud.css, vite.config.ts; PR 7, 10, 15","—","—"],["UI-24","Laudos de Perícia","IMPLEMENTADO","main.ts, match-hud.tsx, hud.tsx, theme.css, progression-hud.tsx, rts-hud.css, vite.config.ts; PR 7, 10, 15","—","—"],["UI-25","Indicadores de voz e chamadas","IMPLEMENTADO","main.ts, match-hud.tsx, hud.tsx, theme.css, progression-hud.tsx, rts-hud.css, vite.config.ts; PR 7, 10, 15","—","—"],["UI-26","Indicador de Megafone","IMPLEMENTADO","main.ts, match-hud.tsx, hud.tsx, theme.css, progression-hud.tsx, rts-hud.css, vite.config.ts; PR 7, 10, 15","—","—"],["UI-27","Notificações e toasts padronizados","IMPLEMENTADO","main.ts, match-hud.tsx, hud.tsx, theme.css, progression-hud.tsx, rts-hud.css, vite.config.ts; PR 7, 10, 15","—","—"],["UI-28","Responsividade e diferentes resoluções","PARCIAL","main.ts, match-hud.tsx, hud.tsx, theme.css, progression-hud.tsx, rts-hud.css, vite.config.ts; PR 7, 10, 15, dev/security-layout-smoke.js","O teste Chrome dev/vote-history-smoke.js verifica alinhamento e ausência de sobreposição entre personagem, equipamento, Agenda e hotbar em 1280×720, 1024×600 e 800×600. Outros painéis e resoluções compactas seguem em revisão. O Dossiê abriu por J, coube inteiro na tela e fechou por botão ou atalho em 1280×720, 1024×600 e 800×600. A Sala de Segurança e a Central de Vigilância limitam a rolagem ao conteúdo e mantêm o cabeçalho acessível. O smoke test em Chrome com gameserver local seleciona a câmera da Lanchonete, espera o feed ao vivo e fecha os dois painéis em 1280×720, 1024×600, 800×600 e 800×360. Em 800×360, antes da correção o cabeçalho do terminal subia para fora da tela. Após a correção, apenas o conteúdo rolou. O teste dos modais legislativos confirma centralização do Dossiê e das Ações institucionais em 1280×720, 1024×600 e 800×600, em Chrome com gameserver local. O seletor de projetos compacta cabeçalho e rodapé em telas baixas. A lista e os detalhes rolam independentemente e PageUp/PageDown navegam pelos detalhes sem tirar o foco da seleção. As colunas da cédula mantêm sua largura e os retratos rolam dentro do grupo quando necessário. Os nicks longos continuam em uma linha com reticências. A loja usa uma altura compacta para o catálogo em telas baixas. A grade 3×3, a compra, o fechamento e a paginação ficam dentro do modal em 800×450. As descrições longas rolam na área de detalhes. O inventário usa proporções compactas em janelas baixas, para manter as ações principais do item visíveis e a hotbar fixa abaixo dos detalhes. A Pesquisa Eleitoral limita a rolagem ao conteúdo e mantém o cabeçalho acessível. Em 800×360, o teste com dois clientes verifica que o modal cabe na janela e que o botão de confirmação fica acessível ao rolar.","Média"],["UI-29","Gerenciamento de foco e teclado","IMPLEMENTADO","main.ts, match-hud.tsx, hud.tsx, theme.css, progression-hud.tsx, rts-hud.css, vite.config.ts; PR 7, 10, 15","—","—"],["UI-30","Animações e microinterações","IMPLEMENTADO","main.ts, match-hud.tsx, hud.tsx, theme.css, progression-hud.tsx, rts-hud.css, vite.config.ts; PR 7, 10, 15","—","—"],["UI-31","SFX integrado às interfaces","IMPLEMENTADO","main.ts, match-hud.tsx, hud.tsx, theme.css, progression-hud.tsx, rts-hud.css, vite.config.ts; PR 7, 10, 15","—","—"],["UI-32","Design system consistente","PARCIAL","main.ts, match-hud.tsx, hud.tsx, theme.css, progression-hud.tsx, rts-hud.css, vite.config.ts; PR 7, 10, 15","Paleta, barras e parte dos painéis são compartilhados. Ainda há estilos legados em paralelo. Ganhos, perdas e valores neutros usam a mesma paleta no seletor de projetos, na cédula e no resumo após votação. Os valores de impacto compartilham sinal e formatação entre seletor, prévia, cédula e histórico. O histórico exibe orçamento em reais conforme o impacto aplicado pelo gameserver. Os testes verificam o gasto de R$ 280 mil e o resultado sem variação de orçamento. A cédula exibe abstenções em um grupo separado dos votos pendentes. O smoke usa seis clientes reais e verifica que uma abstenção muda de grupo sem inflar a contagem de pendentes e pode ser substituída por um voto SIM. Loja e inventário compartilham o tratamento visual do cartão selecionado, dos detalhes e do botão principal, preservando a grade e a distribuição próprias de cada fluxo.","Média"],["UI-33","Tokens de cores, tipografia e espaçamento","PARCIAL","main.ts, match-hud.tsx, hud.tsx, theme.css, progression-hud.tsx, rts-hud.css, vite.config.ts; PR 7, 10, 15","Tailwind centraliza parte dos tokens. Espaçamento e tipografia ainda se repetem em CSS legado. A paleta de impacto está em três tokens Tailwind em theme.css, com uma única regra por tom. Os smokes do seletor e da votação conferem as cores computadas para os valores vindos do fluxo legislativo. O tema do HUD é a fonte dos tokens de borda, raio, seleção, superfície de detalhes e ação principal da loja e do inventário.","Média"],["UI-34","Biblioteca reutilizável de componentes","PARCIAL","main.ts, match-hud.tsx, hud.tsx, theme.css, progression-hud.tsx, rts-hud.css, vite.config.ts; PR 7, 10, 15, dialog-dismiss.tsx, gameplay-dialog.test.tsx, dossier.test.tsx","Há componentes reutilizados de HUD, barras e botões contextuais. StationActionButton é usado nas ações legislativas e eleitorais. Os diálogos de campanha, seleção de projeto, atributos, negociação com parlamentar, resultados e atalhos compartilham o controle de fechamento nativo em DialogDismiss. O teste de atalhos verifica o botão de fechamento e seu nome acessível. Ainda faltam outros controles e modais. Os controles de fechar dos painéis de loja, resultados, pesquisa, seleção de projeto, configurações, vigilância e terminal usam o mesmo ícone. O Dossiê e as ações institucionais reutilizam o botão com callback para devolver o foco ao mapa. O celular usa o mesmo botão para voltar do aplicativo à tela inicial. Testes verificam fechamento nativo, botão de retorno com Escape e fechamento do Dossiê ao renderizar estado real do gameserver. O botão contextual é compartilhado por ações legislativas, eleitorais, de sala e de campo. O teste cobre a apresentação de um controle desabilitado e do motivo do bloqueio. A Pesquisa Eleitoral reutiliza o componente CharacterPortrait para o ranking e para a escolha do apoio público. DialogHeader compartilha título acessível e fechamento nativo em Configurações, Loja, Resultados, Pesquisa, seleção de projeto e nos dois painéis de câmeras. HudIcon concentra a referência ao sprite SVG usada nesses botões, no painel principal, no lançador, nas chamadas e nos efeitos do projeto. Um componente React compartilhado controla os popovers de estabilidade, orçamento e papel secreto, com descrição acessível ligada ao botão enquanto aberto. Telefone, Câmera e Pix compartilham um controlador React de teclas com escopo modal. O seletor de jogos, Snake, Combina Doces e Bets reutilizam o controlador de teclas do celular.","Média"],["UI-35","React integrado ao Phaser","IMPLEMENTADO","main.ts, match-hud.tsx, hud.tsx, theme.css, progression-hud.tsx, rts-hud.css, vite.config.ts; PR 7, 10, 15","—","—"],["UI-36","Tailwind configurado","IMPLEMENTADO","main.ts, match-hud.tsx, hud.tsx, theme.css, progression-hud.tsx, rts-hud.css, vite.config.ts; PR 7, 10, 15","—","—"],["UI-37","Bridge tipada React ↔ Phaser","PARCIAL","main.ts, match-hud.tsx, hud.tsx, theme.css, progression-hud.tsx, rts-hud.css, vite.config.ts; PR 7, 10, 15, surveillance.ts, surveillance.test.ts, SessionRoom.test.ts, security-panel.tsx, surveillance-viewport.ts","O modelo tipado do HUD separa projeção e montagem React. Testes com estado real do PlenaryMatch cobrem atualização seletiva de XP e Agenda, reconexão sem anúncio antigo e limpeza no lobby. Snapshots de movimento não notificam widgets sem mudanças visíveis. O menu de aplicativos e seus atalhos compartilham comandos tipados. hud-apps.test.ts projeta disponibilidade e contadores do snapshot do gameserver. action-shortcuts-smoke.js valida no Chrome mochila, celular, atributos, vigilância, configurações e proteção contra captura dupla do microfone. A configuração do lobby usa comandos tipados para escolher a quantidade de NPCs e iniciar a sessão. A interface lê host, mínimo e contagem confirmada do snapshot. As ações de emenda, auditoria e fraude recebem um comando tipado direto do HUD contextual. A distribuição de atalhos contextuais usa um modelo tipado. context-action-keys.test.ts verifica expansão, o limite de nove teclas e a permanência do botão de Objetos próximos ao abrir o submenu a partir da segunda linha. Ainda há comandos e painéis ligados em main.ts. As ações de verba e cassação agora recebem callbacks tipados do painel político. O HUD contextual usa a projeção compartilhada de alcance, mandato, taxa e saldo. A ação Divulgar evidência usa a mesma regra de alcance do Dossiê React e abre o painel por callback tipado. Os atalhos J e L chamam diretamente os controladores de Dossiê e Pesquisa Eleitoral, sem simular cliques em elementos HTML. O aviso de Megafone usa o mesmo snapshot tipado que informa a fase do jogo. SessionRoom.test.ts confirma o sinal anônimo junto à rota global e sua retirada quando o Megafone termina. hud-model.test.ts verifica que snapshots repetidos não disparam nova renderização e que o aviso some no Plenário. O painel de atributos projeta apenas personagem, stamina inteira e impedimento a partir do controle do Phaser. progression-hud.test.ts confirma que posição e stamina fracionária não alteram a projeção e verifica que o HUD e o gameserver bloqueiam distribuição durante transporte e contagem regressiva, preservando o ponto para a próxima articulação. O gameserver informa locais instaláveis usando a mesma regra que valida o comando. Gameplay.test.ts verifica que uma mesa com pizza e uma cadeira já reservada pelo jogador deixam de oferecer instalação no cliente. Retirar a placa e substituir a placa de outro jogador continuam disponíveis pelo HUD contextual. A retirada de decoração compartilha o limite de inventário com o gameserver. gameplay-dialog.test.tsx instala uma placa, lota a mochila e verifica inspeção disponível, botão desabilitado, ausência do atalho contextual e rejeição no servidor. Largar um item reabilita a retirada. O seletor de fotos da Corregedoria recebe os IDs compatíveis com cada denúncia diretamente do gameserver. internal-mail.test.tsx verifica pessoa, distância e janela de tempo, a aceitação da foto válida e que o boletim público não recebe IDs do álbum. O socket confirma o canal clandestino no snapshot antes de enviar o primeiro quadro identificado. O cliente descarta quadros de canais inativos, fechados ou removidos. Teste WebSocket verifica a ordem e entrega exclusiva ao dono. Na Sala de Segurança, o HUD só indica Ao vivo após o primeiro quadro desenhado pelo Phaser. Ao trocar de câmera, o primeiro quadro usa as posições autoritativas sem interpolar do canal anterior. O teste Chrome com gameserver local reteve um asset do renderer, verificou o estado Conectando e o canvas oculto, liberou o asset, confirmou quadros distintos em duas câmeras e inspecionou a remoção do canvas ao fechar. Objetos próximos expõe abertura, visibilidade e fechamento por uma interface tipada. O HUD usa esse estado para distribuir atalhos sem ler atributos do DOM nem simular clique para fechar o menu. O teste em Chrome com dois clientes abre por atalho, fecha com Escape e recolhe após a coleta confirmada pelo gameserver. A expansão de Mais ações usa estado tipado junto da distribuição de atalhos. context-overflow-smoke.js verifica o teclado, Escape, exclusão mútua com Objetos próximos e abertura da negociação real de NPC. O HUD contextual mantém a barra visível enquanto o snapshot trouxer progresso, mesmo sem botões. Durante instalação de decoração recolhe ações indisponíveis. context-progress.test.tsx verifica progresso e rejeição de comandos concorrentes no gameserver, e context-progress-smoke.js instala um retrato no Chrome, acompanha a barra e confirma o retorno da ação ao terminar. A projeção das ações de campo usa um modelo tipado separado da montagem React. A visibilidade do HUD vem da lista projetada. field-actions.test.tsx usa snapshots do PlenaryMatch e do Gameplay para verificar o corte de energia autorizado, a ocupação dos dois painéis e a retirada dos controles após o reparo. O painel legislativo recebe um snapshot tipado da sala. Mudanças sem impacto na pauta, cédula ou histórico são filtradas antes de renderizar. React controla o contêiner da câmera clandestina. A ponte aceita apenas quadros do canal ativo, retém o mais recente até a montagem e descarta o feed ao trocar ou remover o canal. surveillance-panel.test.tsx verifica a presença do contêiner apenas no modo câmera. O smoke security-layout comprova no Chrome que dois canais clandestinos recebem quadros do gameserver, que o canvas anterior sai ao trocar de canal e que reabrir o painel não retoma o feed. O menu de aplicativos expõe comandos tipados para abrir, fechar e ativar aplicativos. U usa o comando direto e a abertura por clique ou atalho fecha o mesmo menu. O Phaser agora recebe fase, objetos, decoração e mandatos de um único snapshot. A limpeza de visão ao perder conexão descarta também as projeções que alimentam o mapa e a prévia de foto. world-snapshot.test.ts valida o contrato com um objeto largado no Gameplay e um mandato do PlenaryMatch. O gameserver informa a disponibilidade das ações de campanha com a mesma regra que valida os comandos. O HUD retira a propaganda após a última renovação mas mantém o discurso disponível no Painel. Testes integrados verificam a disponibilidade e a recusa sem cobrança durante a contagem regressiva. Os atalhos contextuais executam os mesmos comandos registrados pelos componentes React e preservam o feedback da estação. A montagem e a visibilidade dos botões ainda alimentam a distribuição dos atalhos. A lista tipada de ações contextuais agora calcula visibilidade, prioridade, expansão e teclas antes de renderizar. O atalho usa a mesma lista de comandos. A única consulta ao botão durante o atalho serve à animação de feedback. A lista F2 recebe as ações contextuais disponíveis do mesmo modelo que desenha a barra e resolve o comando na lista atual ao executar. A cédula de projeto, afastamento e cassação compartilha a definição dos atalhos com o controlador. Os comandos usam o eleitorado e a elegibilidade do snapshot, a posição local no Plenário e o estado da cédula recolhida. O catálogo, as opções de diálogo do vendedor e a troca de equipamento usam as mesmas funções para cliques e atalhos. As teclas usam a seleção, a página e a disponibilidade do snapshot. Os atalhos do jogo para a quantidade do item e o uso da hotbar resolvem a ação pelo inventário e pela seleção recebidos do gameserver. O botão da hotbar chama a mesma função. O snapshot do vendedor informa se o catálogo foi aberto diretamente. A UI usa essa informação para habilitar compras que vão direto a um slot de equipamento sem passar pela mochila. A transição de fase e o resultado eleitoral fecham o painel de gameplay pela interface do controlador, que preserva o ciclo de encerramento do celular. O cronômetro, o toast e o som de convocação usam o aviso de projeto publicado pelo gameserver. hud-model.test.ts verifica que a cassação pode consumir o tempo disponível e que o HUD então omite o aviso. Os números do F2 executam a mesma entrada da página que o React renderiza. A grade do celular e o controlador do teclado usam a mesma ordem de aplicativos. O botão e a tecla do Pix compartilham a validação de destinatário, valor e cota com o estado atual do aplicativo. Combina Doces entrega o foco à primeira fruta ao receber o tabuleiro. As setas usam referências React das células. O painel fecha o celular com um único comando de gameplay. O gameserver encerra o Snake e o Chrome confirma que reabrir retorna ao seletor de jogos. O gameserver publica o encerramento do prazo do Protocolo. O teste integrado confirma que a pauta e o catálogo do celular mudam de mensagem no mesmo milissegundo em que o servidor começa a recusar novos projetos. Se a cassação consumir a janela de votação, o gameserver preserva o projeto e publica que ele ficou sem tempo para votação. O cabeçalho passa a mostrar o fim da sessão, e o catálogo identifica o projeto sem votação. O teste integrado confirma a mensagem, o relógio e que a cédula não abre. Um projeto com prazo expirado deixa de oferecer ações de emenda, fraude, correção e declaração de voto. O gameserver também recusa esses comandos para o projeto. Os atalhos do diálogo de negociação com NPC usam as mesmas ações dos botões React e compartilham com o celular o listener que respeita o modal ativo. Os números da Pesquisa Eleitoral selecionam o retrato e executam a mesma ação de confirmação do formulário React, com verificação de mudança antes de enviar. A Central de Vigilância compartilha os comandos de teclado com os botões de canal e monitor. A reabertura da Vigilância envia o fechamento antigo antes de aceitar novos comandos de canal. Cada conversa com NPC tem um identificador emitido pelo gameserver. O encerramento atrasado de uma conversa não fecha a próxima. O teste do servidor entrega o encerramento antigo após abrir a segunda negociação, e o smoke no Chrome troca de interlocutor sem esperar a remoção do conteúdo anterior. O botão Cancelar roubo usa comando próprio. O teste integra a ação contextual do HUD ao gameserver e verifica que o cancelamento preserva o saldo e não gera maleta, e que fechar uma negociação anterior não interrompe o roubo. O canal de negociação com NPC usa comandos tipados para o HUD de campo e o diálogo. O teste do gameserver reabre o mesmo NPC e recusa assinatura e oferta da conversa anterior, sem débito, antes de aceitar a oferta atual. O Chrome confirma duas assinaturas pelo fluxo real. O canal de comandos da Vigilância é tipado. Fotografar envia o canal exibido pelo HUD. O teste do gameserver descarta um canal diferente sem criar foto e aceita a captura do canal aberto. O Chrome troca de câmera e confirma a captura pelo atalho com resposta do gameserver. A validação WebSocket com dois clientes recusa a captura de um canal incorreto e a tentativa de um não proprietário. O cliente dono recebe uma única foto com o nome da câmera e o álbum do outro jogador permanece vazio. A ficha de atributos usa as mesmas ações para seleção por tecla e por botão, com a confirmação condicionada à revisão autoritativa. O menu F2 consulta as ações da ficha de atributos e da celebração no controlador de progressão. A seleção e a confirmação revalidam o estado atual. O F2 projeta as opções de projeto, afastamento e cassação do snapshot autoritativo. Na ativação, revalida a votação, a localização, a elegibilidade e a opção selecionada.","Média"],["UI-38","Migração do HUD legado para React","PARCIAL","main.ts, match-hud.tsx, hud.tsx, theme.css, progression-hud.tsx, rts-hud.css, vite.config.ts; PR 7, 10, 15","Núcleo do HUD, carrossel e resumo temporário das votações estão em React. O teste gera duas votações com o PlenaryMatch e verifica placar, anúncio, paginação inicial e cor da perda de estabilidade no resumo. O seletor de apps do celular também usa React, com atalhos de 1 a 4 e teste de estado selecionado. O smoke test dev/phone-apps-smoke.js confirma no Chrome com gameserver real que o atalho abre o Snake e que trocar de app encerra o jogo. A tela de chamadas também foi migrada. Testes cobrem retrato, atalhos e controles de chamada recebida e ativa. O Snake usa React para placar e controles, com desenho do tabuleiro no canvas. O teste cobre fruta coletada, fim de jogo e controle para reiniciar. Os controles da Câmera usam React e a prévia mantém o canvas. O Chrome testou prévia, captura de selfie pelo gameserver e abertura no Álbum. O Álbum passou a renderizar em React as grades, os detalhes e as apresentações, com teste de cópia privada e apresentação recebida. O celular agora tem navegação inferior, câmera com disparador circular e apps de Correio e Pix. O Correio existe só no celular. Publicação e encaminhamento funcionam à distância durante a articulação, com denúncias formais liberadas pelo servidor junto ao balcão. Pix usa o diretório de jogadores disponíveis, sem limite de distância. O servidor registra o pagamento para investigação bancária e envia aviso só ao destinatário. Teste WebSocket com três jogadores verifica que a prova só aparece para o terceiro após auditoria na Corregedoria e que a auditoria não publica a prova no registro público. Testes Chrome verificam débito, crédito e aviso privado, além da navegação por hotkeys, prévia de selfie, busca de anexos e minigames. As cédulas de projetos e afastamento agora usam React e mantêm as hotkeys. Testes cobrem quórum, participação, voto selecionado e controles desabilitados. O indicador eleitoral, o investimento e o resumo de renovação usam React. Testes cobrem posição, risco, tendência e cronômetro. Os cartões de impacto legislativo agora usam React. Um teste renderiza os valores do PlenaryMatch e verifica ganhos, perdas e zero. O cabeçalho legislativo usa React para projeto, fila, fase e cronômetro. O teste renderiza o estado do PlenaryMatch e verifica a troca para o relógio de isolamento. O aviso de votação lê o alvo diretamente do snapshot. O painel Detalhes usa React para descrição, intenções de voto, contestação e auditoria. Um teste confirma o destaque da declaração e sua retirada a partir do estado autoritativo. O aviso de incêndio usa o modelo React do HUD. Teste com o estado autoritativo verifica o dano periódico e a pausa no Plenário. O aviso de entrevista ao vivo também usa o modelo React. Teste verifica entrada, encerramento e isolamento de atualizações do orçamento. O resultado final usa o modal React, acessível mesmo fora do Plenário. Teste renderiza o desfecho autoritativo de uma partida solo. A escolha de personagem usa React e projeta somente ID, nick e skin recebidos pelo socket, sem renderizar mudanças de posição. character-picker.test.tsx confirma seleção e dois nicks no mesmo retrato. SessionRoom.test.ts confirma que a escolha chega aos demais e um comando repetido não troca a skin. Os seletores de NPCs e infiltrados e o rodapé do lobby agora usam React. lobby-controls.test.tsx verifica o mínimo do gameserver, o estado do convidado, início solo e carregamento de assets. SessionRoom.test.ts confirma configuração por host, rejeição do convidado e início por WebSocket. Os botões contextuais de emenda, auditoria, fraude, correção, propaganda, discurso, entrevista e contestação usam React. election-station-actions.test.tsx integra o estado do PlenaryMatch e verifica estação, gasto em propaganda, uso do discurso, exigência de voz e ocultação no countdown. legislative-station-actions.test.tsx renderiza snapshots reais antes e depois da auditoria e da correção, e confirma ocultação durante a votação. PlenaryMatch.test.ts valida posição, autorização e sigilo. Os slots de equipamento usam React e renderizam somente quando muda a projeção dos itens, cargas ou temporizadores. equipped-gear.test.tsx cobre compra, encaixe, duração e recarga de binóculo com Gameplay e PlenaryMatch reais. O card do personagem tem uma raiz React para retrato, nick, gabinete, papel privado, recursos e feedback de XP. character-profile.test.tsx renderiza snapshots de Gameplay e PlenaryMatch, verifica segredo do papel, gabinete e atualização de stamina sem trocar o snapshot de identidade. O indicador de latência usa React e o ping nativo da sala. connection-latency.test.tsx cobre descarte de respostas atrasadas, silêncio durante desconexão e retomada com valor novo. SessionRoom.test.ts verifica um ping real depois da reconexão. Partes do HUD fixo ainda usam DOM imperativo. A tela final ocupa o viewport e separa os retratos dos vencedores e derrotados. Testes renderizam vitória parlamentar, vitória da infiltração e encerramento sem vencedor com snapshots do servidor. Os formulários de verba e afastamento e o acionamento de cassação usam React. institutional-actions.test.tsx usa snapshots do PlenaryMatch para verificar alcance, cobrança e bloqueio ao iniciar a votação. No Chrome com gameserver local, a ação contextual abriu a verba, selecionou o desvio e confirmou o novo saldo. O Dossiê usa uma raiz React para provas, escolha de destinatário, preço e ofertas. dossier.test.tsx usa PlenaryMatch para verificar prova privada, compra fora de alcance e divulgação somente na imprensa. A TV de campanha foi migrada para React e usa o componente compartilhado de retrato. campaign-tv.test.tsx renderiza a propaganda autorizada pelo PlenaryMatch e verifica os dois lados do HUD, a opção de movimento reduzido e o anúncio acessível. Os efeitos de dinheiro e XP acima do jogador usam React. reward-effects.test.tsx renderiza os ganhos derivados de um desvio e de uma missão de café processados pelo gameserver. Dossiê e Ações institucionais usam modais nativos centrais com conteúdo React. O Dossiê fecha com J ou Escape e é encerrado quando começa a votação. legislative-modals-smoke.js verifica os dois fluxos e a atualização autoritativa do saldo após o desvio de verba. O indicador eleitoral, seu estado de urgência e o botão de abertura passaram a ser renderizados pela mesma raiz React. A Pesquisa substituiu o select de apoio público por retratos com seleção e confirmação por teclado. Título, impacto, detalhes, cédulas, resumo de resultado e histórico passaram a compor uma única raiz React do painel legislativo. plenary-panel.test.tsx renderiza a pauta, o voto e o resultado a partir do PlenaryMatch. O convite do lobby e o botão de Configurações ao lado dele passaram para React. Em caso de bloqueio da área de transferência, o campo seleciona o link para cópia manual. O monitor de Vigilância monta a área de vídeo pelo React. O Phaser continua responsável pelo canvas dentro dessa área. O atalho visual de Configurações durante a votação é montado pelo HUD React, com o mesmo rótulo e tecla K da lista de aplicativos. A entrada da sala passou para React, incluindo validação do nick, campos, feedback e estado de conexão. A tela de carregamento usa React para exibir progresso, erro e retorno ao lobby, com o progresso recebido do Phaser. A barra contextual reúne estações, ações de campo, progresso, objetos próximos e ações extras em uma única raiz React.","Média"],["UI-39","Migração dos modais para React","IMPLEMENTADO","main.ts, match-hud.tsx, hud.tsx, theme.css, progression-hud.tsx, rts-hud.css, vite.config.ts; PR 7, 10, 15","Atributos, campanha, loja, resultados, Correio e negociação com parlamentar usam React. O teste do modal de negociação cobre atalhos e assinatura sem saldo. O gameserver testa assinatura, ofertas concorrentes e aplicação do voto. O painel de atalhos usa React e preserva a navegação por F2, setas e números. O teste do cliente verifica a numeração de cada página e os limites de navegação. O smoke test dev/action-shortcuts-smoke.js abriu uma partida no Chrome com o gameserver local, verificou navegação pelas setas e executou por número a ação de fechar um modal. Configurações abre em diálogo nativo central via menu ou tecla K. O smoke test Chrome confirma fechamento pelo botão e por Esc e acesso ao personagem pela tecla P. Configurações agora usa RoomSettings em React e o fechamento compartilhado DialogDismiss, preservando o diálogo nativo. room-settings.test.tsx cobre as preferências e os estados do microfone. action-shortcuts-smoke.js validou no Chrome com gameserver local a abertura no lobby e por K, gravação das preferências, permissão de microfone negada, fechamento e saída da sala. A confirmação de troca de equipamento também usa React. equipment-replacement.test.tsx cobre rótulos e atalhos. market-smoke.js validou no Chrome com gameserver local equipar em espaço livre sem abrir o modal, focar Não quando há conflito e confirmar via tecla 1. Foundations.test.ts verifica a rejeição quando o equipamento do slot mudou. Os diálogos de Pesquisa Eleitoral e Resultados usam uma raiz React cada, com o fechamento nativo compartilhado. action-shortcuts-smoke.js verifica a tecla L, a classificação recebida e o fechamento no Chrome. results.test.tsx renderiza uma renovação e uma cassação sem maioria produzidas pelo gameserver dentro do diálogo. A Central de Vigilância passou a usar uma raiz React para cabeçalho, canais e monitor, com o fechamento compartilhado. O smoke test Chrome verifica a tecla V, a troca de abas e o fechamento. SessionRoom.test.ts verifica o envio de quadros ao cliente autorizado e a rejeição de acesso por outro jogador. A loja e o diálogo do vendedor agora compartilham uma raiz React. market-smoke.js verificou compra, paginação estável, equipamento e fechamento por clique e Esc com o gameserver local. O aviso de início de votação renderiza em React os segundos publicados pelo gameserver. ballot-countdown.test.tsx cobre a mensagem de 5 a 1 s. vote-history-smoke.js confirmou no Chrome que Esc mantém a contagem aberta e que o diálogo fecha ao iniciar a votação autoritativa. O diálogo de gameplay passou a renderizar em React o cabeçalho do inventário, dos equipamentos, do armário e dos aplicativos, além dos controles dos objetos instalados. gameplay-dialog.test.tsx verifica fechamento do diálogo, volta do aplicativo e permissões dos objetos. Gameplay.test.ts valida alcance, instalação, rabisco, retirada e consumo de fatias no gameserver. phone-apps-smoke.js confirmou no Chrome a volta via botão e Esc, os atalhos de inventário e equipamento e o fluxo de selfie publicada no Correio. O conteúdo de gameplay e o seletor de destinatário passaram para React. O Correio ocupa um contêiner fixo no diálogo, e a troca de aplicativos é renderizada em React. phone-apps-smoke.js validou minijogos, câmera, álbum, Correio, Pix, inventário e equipamento. phone-pix-smoke.js validou com dois clientes a oferta e aceitação de café no inventário, Pix privado e publicação no Correio, tudo por comandos do gameserver. O novo terminal da Sala de Segurança também usa React para seleção de câmera, status da imagem e fechamento. security-panel.test.tsx cobre seleção e status. SessionRoom.test.ts verifica autorização, troca de câmera, feed privado e encerramento ao sair do terminal. No Chrome com gameserver local, trocar a câmera preservou o canvas Phaser. O diálogo reabriu e fechou pelo botão e pelo Esc.","—"],["UI-40","Separação de estado de UI e gameplay","IMPLEMENTADO","main.ts, match-hud.tsx, hud.tsx, theme.css, progression-hud.tsx, rts-hud.css, vite.config.ts; PR 7, 10, 15","—","—"],["UI-41","Evitar rerenders React a cada frame","IMPLEMENTADO","main.ts, match-hud.tsx, hud.tsx, theme.css, progression-hud.tsx, rts-hud.css, vite.config.ts; PR 7, 10, 15","—","—"],["UI-42","Pointer events sem bloquear o canvas","IMPLEMENTADO","main.ts, match-hud.tsx, hud.tsx, theme.css, progression-hud.tsx, rts-hud.css, vite.config.ts; PR 7, 10, 15","—","—"],["UI-43","Remoção de interfaces legadas duplicadas","PARCIAL","main.ts, match-hud.tsx, hud.tsx, theme.css, progression-hud.tsx, rts-hud.css, vite.config.ts; PR 7, 10, 15","Transferência entre jogadores fica só no Pix do celular. As ações de verba e afastamento continuam acessíveis pelo mapa, e o Correio fica no celular. A Secretaria abre um modal React contextual para a pauta durante a articulação. A estação de revisão de impacto foi removida do Apoio Técnico a pedido de Rafael. O teste do cliente usa snapshots do PlenaryMatch antes e depois de protocolar projetos. O teste do servidor verifica estação e fase. O Registro público foi removido do Dossiê legado e abre no Arquivo pelo mesmo modal contextual. Testes verificam alcance e confirmam que pagamentos privados ficam fora do registro exibido. A ponte de aplicativos eliminou os botões ocultos para mochila, celular, atributos, vigilância, equipamentos e configurações. action-shortcuts-smoke.js verifica a ausência desses controles e confirma acesso pelos controles visíveis e atalhos. Os botões legislativos e eleitorais estáticos saíram do HTML. Os cartões de Objetos próximos usam React com chaves por origem e item. nearby-items.test.tsx verifica retratos e rótulos, e Gameplay.test.ts verifica custódia e coleta única. No Chrome sem som nem microfone, abrir o menu e pegar café pelo teclado fechou o menu após a confirmação do gameserver. As atividades de sala e os atalhos de verba, afastamento, cassação e divulgação também usam StationActionButton e callbacks tipados. station-shortcuts.test.tsx verifica o café e a verba com o PlenaryMatch, incluindo alcance, recarga, consumo e o encerramento do contexto no countdown. Ainda há UI legada ativa. Foram removidos os controles HTML de verba, afastamento e cassação substituídos pelo componente React. O Dossiê usa conteúdo React e a ação de divulgação não consulta o formulário HTML. Os seletores e botões legados do lobby foram substituídos por React, incluindo a grade de personagens e seus nicks. Ainda há painéis legados por revisar. Os acionadores legados de Dossiê e Ações institucionais saíram da interface. O atalho J, a divulgação na imprensa e os controles contextuais de verba e afastamento dão acesso aos painéis. Nova oferta gera aviso privado com o atalho. A montagem imperativa da TV de campanha foi removida. SessionRoom.test.ts verifica que três clientes recebem a mesma propaganda uma única vez, incluindo quem a comprou. O template HTML e a criação imperativa dos efeitos de dinheiro e XP foram removidos. O teste cobre o primeiro snapshot, a supressão de XP na reconexão e ações repetidas sem novo ganho. Foram removidos os contêineres expansíveis antigos do Dossiê e das Ações institucionais, junto com seus estilos e acionadores ocultos. O teste em Chrome confirma a ausência dos três contêineres legados durante o jogo. O botão e o contêiner HTML de Objetos próximos foram substituídos por uma raiz React junto aos cartões de item. nearby-items.test.tsx verifica o grupo acessível e phone-pix-smoke.js verifica coleta pelo teclado e fechamento após confirmação. O botão Mais ações, seu indicador de tecla e a quebra da linha extra agora são renderizados por React. O teste em Chrome com gameserver local confirma que a linha extra aparece acima da barra e mantém os três atalhos originais. Os badges de atalho da barra contextual agora são desenhados diretamente a partir de aria-keyshortcuts. O HUD atualiza o atributo sem inserir nem remover elementos de badge. O teste de navegador verifica o número exibido para uma ação principal, Mais ações e um item no submenu. O HTML estático do painel legislativo agora contém apenas o ponto de montagem. Os seis adaptadores React substituídos foram removidos. O dock oculto de voz e o botão F2 legado foram removidos do HTML, junto com o remanejamento entre lobby e partida, os estilos e o gerador de badge sem uso. A voz permanece nos controles de Configurações e o atalho F2 continua abrindo a lista React. O controle imperativo de cópia do convite foi removido, incluindo a caixa de diálogo nativa de fallback. O componente é desmontado ao sair da sala. O gatilho estático de Configurações no rodapé saiu do HTML. Durante a votação, o controle no HUD React abre o modal já usado pelos aplicativos, com acesso ao microfone. O atalho U deixou de procurar e simular o clique no botão. action-shortcuts-smoke.js cobre abertura por U e clique, fechamento ao abrir o celular com C e alternância por U. O HTML estático da entrada contém apenas o ponto de montagem. Os handlers dos campos e do formulário saíram de main.ts. O carregamento no HTML estático usa apenas o ponto de montagem. main.ts repassa o estado ao componente sem manipular os controles. O controlador global de popovers que criava e atualizava o elemento manualmente foi removido. Cada botão React monta sua ajuda em um portal sob demanda. O atalho das ações contextuais deixou de simular clique no DOM. Foram removidos os pontos de montagem individuais, a leitura de botões para atribuir teclas e a mutação imperativa dos seus atributos. A lista F2 deixou de inspecionar e simular clique nos botões da barra contextual. Os demais controles ainda usam o mecanismo anterior. Y, R, N e os números da cassação deixaram de procurar e clicar nos botões da cédula. Os atalhos próprios da loja e da troca de equipamento não simulam cliques. O seletor F2 geral mantém seu fluxo anterior para esses modais. As setas de quantidade e Shift+1–6 fora dos modais deixaram de simular cliques no inventário e na hotbar. main.ts e results.tsx deixaram de procurar o diálogo de gameplay para fechá-lo. O retorno ao lobby usa o teardown do controlador de resultados para encerrar suas duas janelas. O teclado do F2 deixou de simular o clique no próprio menu. Os controles de origem que ainda são descobertos pelo DOM preservam seu caminho anterior. Os números da tela inicial do celular chamam a seleção de aplicativo diretamente. A tecla de enviar Pix executa o comando diretamente, sem clique sintético no botão. Os atalhos de discar, atender, encerrar, trocar para selfie, fotografar e abrir o álbum foram ligados diretamente às ações dos apps. Seleção de minijogos, reinício de Snake e Combina Doces e aposta do Bets executam comandos sem clique sintético. Os números na negociação com NPC dispensam clique simulado. O smoke legislativo remove o atributo de atalho dos botões e conclui as duas assinaturas no gameserver pelo teclado. A Pesquisa Eleitoral deixou de simular cliques para declarar e retirar apoio. O teste de dois clientes Chrome remove os atributos dos botões, envia os comandos por teclado e confirma no outro cliente os estados de apoio e retirada. A Central de Vigilância abre e fecha canais por ações diretas. O smoke remove o atributo de atalho, troca entre duas câmeras no gameserver e verifica a troca do quadro ao vivo e a limpeza do canvas. O smoke de atributos remove os atributos de atalho do DOM, investe em Fôlego por tecla no gameserver e confirma o bloqueio de novo investimento durante a contagem. A celebração de nível abre a ficha ou adia a distribuição por comandos diretos. O cenário Chrome espera o estado inicial do gameserver, recebe um level up real, remove o atributo de atalho e abre a ficha pela tecla 1, preservando os pontos até a confirmação. O smoke também valida Depois pela tecla 2 sem o atributo do botão. A ficha permanece fechada até o jogador apertar P. Os dois pontos concedidos pelo gameserver seguem disponíveis e o Fôlego não muda. O F2 dos modais de progressão dispensa a inspeção dos botões. O Chrome remove o rótulo original de Fôlego, seleciona pelo F2 e confirma no gameserver o investimento. O F2 das cédulas usa ações diretas. Os testes cobrem afastamento sem mandato, remoção de alvo de cassação desconectado e voto de projeto no Chrome com outro rótulo no botão original. O F2 da loja e da troca de equipamento usa as ações do controlador, com invalidação quando o catálogo muda. O smoke compra Binóculo por F2, confirma troca por Megafone e verifica zero cliques simulados. A negociação registra as ações habilitadas no F2 e invalida a entrada quando o painel publica um novo conjunto de ações. O Chrome altera os rótulos dos botões originais e confirma duas assinaturas pelo F2 no gameserver.","Média"],["UI-44","Validação visual automatizada/manual","PARCIAL","main.ts, match-hud.tsx, hud.tsx, theme.css, progression-hud.tsx, rts-hud.css, vite.config.ts; PR 7, 10, 15, SessionRoom.test.ts","Chrome validou a loja em 1280×720 e 1024×600 com grid fixo, seleção por tecla e compra real confirmada pelo gameserver. O teste dev/market-smoke.js mede a estabilidade do layout. Outro teste Chrome navega entre duas votações do gameserver com as setas reais e verifica os limites do carrossel. O mesmo teste mede os três tamanhos de desktop durante a articulação, confirma que o HUD de exploração some durante o voto e reaparece na rodada seguinte. O card de incêndio foi conferido no Chrome com incidente emitido pelo gameserver. Falta cobertura visual recorrente de outros fluxos complexos. O teste Chrome em duas abas, com áudio e microfone desativados, abriu o Dossiê via ação do mapa ou tecla J, verificou oferta paga, privacidade até a compra e remoção da prova após divulgação na imprensa. action-shortcuts-smoke.js verifica o acesso e a disposição do Dossiê em três viewports. Em duas abas do Chrome, o botão contextual Pedir afastamento abriu e fechou o formulário, aceitou o alvo e iniciou a votação nas duas abas. campaign-tv-smoke.js verifica duas propagandas compradas em sequência em duas abas do Chrome com gameserver real, sem som e sem microfone. Testa a ordem da fila, os lados da entrada, a identidade do anúncio, o movimento reduzido em 1024×600 e a limpeza da TV e do anúncio acessível. reward-smoke.js validou os ganhos de café (+20 XP) e desvio (+R$ 30 mil) com gameserver real no Chrome, sem som e sem microfone. Mede posicionamento dentro do mapa, subida e fade em 1280×720 e fade sem deslocamento em 1024×600 com movimento reduzido. Confirma que os dois efeitos saem do DOM ao terminar. attributes-smoke.js roda no Chrome em 1024×600, sem som nem microfone. Usa as teclas 4 e 5 para elevar a stamina de 100 para 110 pelo WebSocket e verifica que as mesmas teclas não selecionam nem gastam o ponto restante durante a contagem regressiva. O teste multiplayer que valida movimento, voz e snapshots privados fecha as conexões com consentimento antes de encerrar o servidor local. Isso evita que a limpeza acione tentativas automáticas de reconexão e mascare o resultado das verificações. O CI executa security-layout-smoke.js em Chromium headless com gameserver local, sem som nem microfone. Verifica seleção de câmera, renderização ao vivo e rolagem do terminal em quatro resoluções. A loja também roda no CI em Chrome headless com gameserver local. market-smoke.js verifica nove slots e paginação sem deslocamento em 1024×600 e 1280×720, compra por teclado, equipamento automático em slot livre e confirmação ao comprar um terceiro acessório. Confirma que o equipamento substituto aparece no HUD e que a loja não solicita acesso ao microfone. O CI roda vote-history-smoke.js com gameserver local e Chrome headless, sem som nem microfone. Mede o HUD da articulação em três resoluções, verifica a transição da Agenda e do painel legislativo, o recolhimento da votação, os três votos por teclado, o retrato e nick no grupo correspondente e os limites do histórico de votações. O CI também abre os modais de verba e Dossiê em três resoluções e verifica que a convocação de afastamento exige um alvo e que o voto aparece no placar de dois clientes do gameserver. O CI também executa em Chromium com gameserver local os fluxos de Pix entre dois clientes, TV de campanha, distribuição de atributos e feedback visual de XP e dinheiro. O CI verifica o menu Mais ações, a preservação dos três atalhos da primeira linha, a alternância com Objetos próximos e a abertura da conversa com um NPC. Também confere a barra de instalação de um retrato com o botão de instalar oculto, o avanço do valor acessível e a ação de retirada após a confirmação do gameserver. phone-pix-smoke.js abre a Pesquisa Eleitoral em dois clientes Chrome, escolhe o apoio pelo retrato usando o teclado e confirma declaração e retirada pelo snapshot do outro jogador. PlenaryMatch.test.ts verifica as mesmas transições e a rejeição de autoapoio. vote-history-smoke.js confirma que a cédula recolhida continua recolhida quando o relógio muda, que o resultado temporário expira e que o histórico mantém a página selecionada durante a contagem de outra votação. O teste Chrome de ações contextuais confirma a ausência dos quatro elementos legados de voz e verifica que K abre Configurações e F2 abre e fecha o painel de atalhos com a ação Ativar voz, sem solicitar microfone. O smoke test do Pix verifica a cópia do convite, a seleção do link quando o navegador recusa acesso à área de transferência, a entrada real de outro cliente pelo link e o desaparecimento do convite ao iniciar a sessão. security-layout-smoke.js verifica o terminal em 1280×720, 1024×600, 800×600 e 800×360, além da troca de câmeras clandestinas com canvas renderizado e descarte do feed ao fechar. legislative-modals-smoke.js verifica o seletor em 800×360 e 620×360, rolagem por teclado, confirmação visível e chegada do documento selecionado ao inventário pelo gameserver. A matriz agora inclui o grupo exploration-hud com atalhos, planta e celular no browser contra o gameserver real. O grupo passou localmente e produz três capturas para inspeção. A publicação do artefato aguarda execução do GitHub Actions. vote-history-smoke.js testa uma sala cheia de seis clientes, concentra todos os votos na mesma coluna e verifica limites do placar, último retrato acessível e truncamento dos nicks em 1280×720 e 800×600. O job guarda as duas capturas. room-entrance-smoke.js valida no Chrome a criação de sala, o convite, o nick salvo e a recuperação após rejeição de nick duplicado pelo gameserver. O cenário é executado pelo job exploration-hud. asset-loading-smoke.js bloqueia um asset no Chrome, provoca falha, volta ao lobby e confirma que uma nova sala inicia a partida após restaurar o asset. hud-help-smoke.js verifica no Chrome com o gameserver real hover, clique para fixar, Escape, foco, clique externo e limites da tela em 1280×720 e 800×600. context-overflow-smoke.js cobre teclado para expansão, Objetos próximos, conversa com NPC e coleta confirmada de café, e verifica que nenhum clique sintético alcança o HUD. Os smokes context-overflow e context-progress passaram no Chrome com gameservers de teste, cobrindo teclas, coleta confirmada, conversa, expansão e barra de progresso. O smoke de ações contextuais altera o nome acessível do botão de café no DOM e verifica que F2 mantém o nome correto do modelo, recolhe o café pela tecla da lista e aguarda confirmação sem clique sintético. ballot.test.tsx verifica votação de afastamento e a remarcação das teclas após saída de candidato, usando snapshots reais. vote-history-smoke.js verifica o caminho de teclado com a cédula recolhida e depois sem o atributo data-vote no botão. market-smoke.js testa paginação estável, seleção após remover o atributo da tecla no DOM, compra, equipamento direto e confirmação de substituição. O Chrome verifica ausência de cliques sintéticos nos dois modais. market-smoke.js confere limites do modal e estabilidade da grade ao paginar em 800×450, 1024×600 e 1280×720. phone-apps-smoke.js verifica que a tela inicial do celular exibe todos os aplicativos e que o Pix pode ser aberto por atalho em 800×450. Ambos passaram no Chrome. context-overflow-smoke.js seleciona um Café em 800×450, compara os limites do modal, da coluna de detalhes e da hotbar com os do estado sem seleção, verifica que Largar no chão cabe na área visível e confirma a remoção do item pelo gameserver. O smoke do Chrome usa uma pilha de três doses. Retira o atributo visual da seta, ajusta a quantidade por teclado, larga duas doses e consome a última pela hotbar sem reabrir o inventário nem gerar clique. Os testes da loja e do inventário alteram temporariamente tokens de seleção, detalhe e ação principal e confirmam os estilos computados no Chrome antes de continuar os fluxos de compra e descarte. O smoke da loja também enche a mochila pelo gameserver, compra e equipa três itens em slots livres e confirma que uma quarta compra fica desabilitada quando os dois slots de acessórios estão ocupados. O smoke de votação abre o celular durante articulação e verifica que ele fecha na transição para a cédula. O smoke de atalhos verifica que a tecla do F2 fecha Atributos mesmo após remover a tecla do botão renderizado, sem gerar clique no F2. O smoke do celular abre o Pix pela tecla em 800×450 mesmo após remover o atributo de atalho do botão, sem gerar clique sintético. O smoke de dois clientes confirma o envio por teclado após remover o atributo do botão do Pix, a dedução no saldo e o recebimento remoto. O Chrome confirma chamada e recusa via gameserver, além de uma selfie salva no álbum, mesmo com os atributos de teclado removidos dos botões. O teste no Chrome verifica início e reinício do Snake, renovação do tabuleiro de Combina Doces e resultado e saldo do Bets após remover os atributos de atalho dos botões. O Chrome navega com setas, seleciona duas frutas com Enter e verifica a pontuação da troca confirmada pelo gameserver. O smoke legislativo percorre pedido, inventário, duas negociações e conclusão da Agenda no gameserver. A negociação oferece o documento avulso e omite o projeto de lei. O Chrome abre, fecha e reabre a Vigilância, seleciona uma câmera antes do evento nativo de fechamento e verifica que o gameserver entrega o quadro. O teste também usa os atalhos sem focar os botões. O smoke de Pix e apoio eleitoral mede o cabeçalho fixo e a posição da confirmação da Pesquisa Eleitoral em 800×360 e confirma a replicação do apoio e da retirada no outro cliente. O smoke do afastamento usa F2 com o rótulo do botão original alterado e confirma, em dois clientes Chrome, a seleção do voto e a replicação da participação pelo gameserver. O smoke de cassação abre o F2 com três clientes, desconecta um candidato e aciona a entrada antiga. Nenhum voto é redirecionado. Reabrir o menu retira o candidato, e o cliente observador recebe a participação após um voto válido.","Média"],["UI-45","Coerência com a direção artística existente","NÃO VERIFICÁVEL","main.ts, match-hud.tsx, hud.tsx, theme.css, progression-hud.tsx, rts-hud.css, vite.config.ts; PR 7, 10, 15","Paleta e assets seguem convenções existentes. Coerência visual global exige revisão editorial.","—"],["D-01","Corrupção não identifica facção","IMPLEMENTADO","PlenaryMatch.ts, PoliticalEconomy.ts, Gameplay.ts, SessionRoom.ts, InternalMail.ts; PR 8, 12, 14, 15","Economia e papéis usam estados separados.","—"],["D-02","Economia com conservação de valor","IMPLEMENTADO","PlenaryMatch.ts, PoliticalEconomy.ts, Gameplay.ts, SessionRoom.ts, InternalMail.ts; PR 8, 12, 14, 15","Reconciliação distingue emissão e expiração de circulação e gastos. Testes validam a conservação no roubo de cofre, descarte, coleta, resgate único, transferências, taxas e orçamento.","—"],["D-03","Dinheiro físico precisa ser transportado","IMPLEMENTADO","PlenaryMatch.ts, PoliticalEconomy.ts, Gameplay.ts, SessionRoom.ts, InternalMail.ts; PR 8, 12, 14, 15","Coleta transfere custódia; Tesouraria e cofre liquidam o valor.","—"],["D-04","Patrimônio pessoal fica no cofre","IMPLEMENTADO","PlenaryMatch.ts, PoliticalEconomy.ts, Gameplay.ts, SessionRoom.ts, InternalMail.ts; PR 8, 12, 14, 15","O cofre representa o saldo do titular.","—"],["D-05","Segurança presencial","IMPLEMENTADO","PlenaryMatch.ts, PoliticalEconomy.ts, Gameplay.ts, SessionRoom.ts, InternalMail.ts; PR 8, 12, 14, 15","Ações de gabinete validam proximidade e presença do titular.","—"],["D-06","Renovação de Mandato não é afastamento","IMPLEMENTADO","PlenaryMatch.ts, PoliticalEconomy.ts, Gameplay.ts, SessionRoom.ts, InternalMail.ts; PR 8, 12, 14, 15","A eleição elimina mandato; audiência suspende.","—"],["D-07","NPCs não participam da Renovação","IMPLEMENTADO","PlenaryMatch.ts, PoliticalEconomy.ts, Gameplay.ts, SessionRoom.ts, InternalMail.ts; PR 8, 12, 14, 15","A eleição usa lista humana separada.","—"],["D-08","Ex-parlamentar permanece no mapa","IMPLEMENTADO","PlenaryMatch.ts, PoliticalEconomy.ts, Gameplay.ts, SessionRoom.ts, InternalMail.ts; PR 8, 12, 14, 15","O estado former preserva movimentação e objetos.","—"],["D-09","Missões são secretas","IMPLEMENTADO","PlenaryMatch.ts, PoliticalEconomy.ts, Gameplay.ts, SessionRoom.ts, InternalMail.ts; PR 8, 12, 14, 15","Cada cliente recebe sua projeção privada.","—"],["D-10","Não existe mais categoria formal de Caprichos","IMPLEMENTADO","PlenaryMatch.ts, PoliticalEconomy.ts, Gameplay.ts, SessionRoom.ts, InternalMail.ts; PR 8, 12, 14, 15","Agenda usa um catálogo e um fluxo de conclusão.","—"],["D-11","Assinatura verdadeira não garante documento verdadeiro","IMPLEMENTADO","PlenaryMatch.ts, PoliticalEconomy.ts, Gameplay.ts, SessionRoom.ts, InternalMail.ts; PR 8, 12, 14, 15","Assinatura tem vínculo privado com o projeto assinado.","—"],["D-12","Falsificação não cria apoio institucional válido","IMPLEMENTADO","PlenaryMatch.ts, PoliticalEconomy.ts, Gameplay.ts, SessionRoom.ts, InternalMail.ts; PR 8, 12, 14, 15","Protocolo verifica o vínculo com as assinaturas.","—"],["D-13","Publicação não equivale a prova","IMPLEMENTADO","PlenaryMatch.ts, PoliticalEconomy.ts, Gameplay.ts, SessionRoom.ts, InternalMail.ts; PR 8, 12, 14, 15","Correio publica snapshots e não aplica penalidade por texto.","—"],["D-14","Laudo comprova autenticidade, não autoria da falsificação","IMPLEMENTADO","PlenaryMatch.ts, PoliticalEconomy.ts, Gameplay.ts, SessionRoom.ts, InternalMail.ts; PR 8, 12, 14, 15","Laudo contém versão e resultado, sem atribuir autoria.","—"],["D-15","Equipamentos de espionagem geram informação limitada","IMPLEMENTADO","PlenaryMatch.ts, PoliticalEconomy.ts, Gameplay.ts, SessionRoom.ts, InternalMail.ts; PR 8, 12, 14, 15","Espionagem replica canais e frames conforme acesso.","—"],["D-16","Agressões furtivas exigem percepção legítima","IMPLEMENTADO","Complaints.ts, Complaints.test.ts, SessionRoom.test.ts, PlenaryMatch.test.ts, internal-mail.test.tsx","Testemunhas fora de visão, ausentes ou nocauteadas não recebem ocorrência de agressão. A vítima pode denunciar.","—"],["D-17","O jogo deve permitir blefes","IMPLEMENTADO","PlenaryMatch.ts, PoliticalEconomy.ts, Gameplay.ts, SessionRoom.ts, InternalMail.ts; PR 8, 12, 14, 15","Missões privadas e documentos manipuláveis permitem blefe.","—"],["D-18","Satirizar através do gameplay","NÃO VERIFICÁVEL","PlenaryMatch.ts, PoliticalEconomy.ts, Gameplay.ts, SessionRoom.ts, InternalMail.ts; PR 8, 12, 14, 15","Há sátira em projetos, objetos e interações; qualidade é avaliação editorial.","—"],["EXP-01","Missões do anexo com mecânicas existentes","IMPLEMENTADO","PersonalAgenda.test.ts, PlenaryMatch.test.ts, Power.multiplayer.test.ts, mission-row.test.tsx","Adicionados Plantão Parlamentar (N08), Privilégio Adquirido (N11), Amizade Institucional (N21), Investimento Político (N29) e Solenidade de Inauguração (N75). Corrigidos locais públicos (N07), transferência nominal de R$ 10 mil (N16) e Cafezinho durante a articulação (N80). O gameserver testa ações reais, interrupção, rejeição, duplicatas e XP. A interface testa requisitos, tempo e valores do estado autoritativo. Vigilância Institucional (N57) conta duas câmeras diferentes após o primeiro quadro de cada feed autorizado. SessionRoom.test.ts verifica acesso distante, ID inválido, repetição, progresso privado e XP. mission-row.test.tsx verifica sorteio solo e renderização de 0/2, 1/2 e conclusão. Manutenção de Emergência (N63) usa o reparo cooperativo validado pelo gameserver. As dependências indisponíveis estão listadas abaixo.","—"],["EXP-02","Projetos do anexo com efeitos jogáveis","IMPLEMENTADO","PlenaryMatch.test.ts, Foundations.test.ts, project-impact.test.tsx","Quinze dos 17 projetos possuem efeitos reais. O gameserver também verifica que dois subsídios aprovados em votações sucessivas expiram nos respectivos prazos e preservam a contabilidade pública. O teste do cliente abre a votação dos 15 e verifica os banners e efeitos exibidos a partir do estado do gameserver. O teste do Mutirão confirma o efeito somente após aprovação e até o prazo anunciado. Minha Pinga, Minha Vida distribui uma dose de R$ 5 mil por mandato conectado, financiada pelo orçamento. A Transparência Seletiva cobra R$ 10 mil por consulta bancária que revela um registro privado, durante 120 s. A Economia de Energia reduz o custeio em R$ 20 mil e a recarga do corte elétrico de 45 s para 15 s, durante 300 s.","—"],["EXP-03","Nada a Declarar (MIS-N54)","IMPLEMENTADO","Gameplay.test.ts, PersonalAgenda.test.ts, mission-row.test.tsx","O servidor conta até 15 segundos de deslocamento com dinheiro e com a Cueca do Mensalão ativa. Ficar parado, largar o dinheiro ou expirar o efeito interrompe o progresso. O HUD exibe o tempo confirmado pelo servidor.","—"],["EXP-04","Cerimonial Oficial (MIS-N73)","IMPLEMENTADO","PersonalAgenda.test.ts, photo-missions.ts, mission-row.test.tsx","O sorteio exige um retrato instalado. O teste de captura verifica selfie distante, foto comum próxima e selfie válida junto ao retrato de outro jogador. O HUD identifica o objetivo e a conclusão.","—"],["EXP-05","Visita de Cortesia (MIS-N24)","IMPLEMENTADO","PersonalAgenda.test.ts, Gameplay.ts, mission-row.test.tsx","Exige uma interação bem-sucedida dentro do gabinete indicado, como tirar uma foto. O teste integrado rejeita a simples entrada, uma ação inválida e uma foto no gabinete de outro jogador com o mesmo nick. O HUD exibe o alvo e um exemplo de ação.","—"],["EXP-06","Discrição Orçamentária e Caixa Dois (MIS-N31 e MIS-N35)","IMPLEMENTADO","Gameplay.ts, PersonalAgenda.test.ts, mission-row.test.tsx","O gameserver valida a entrega presencial e usa o valor do objeto aceito. O teste cobre sorteio com lote exato, Pix sem progresso, valor diferente, distância e repetição do aceite. O HUD distingue os dois objetivos.","—"],["EXP-07","Fiscalização Paralela e Patrimônio Suspeito (MIS-N49 e MIS-N50)","IMPLEMENTADO","Gameplay.test.ts, PersonalAgenda.test.ts, mission-row.test.tsx","O Raio X emite progresso privado quando o gameserver revela um cofre alheio ou o saldo de um NPC. Testes cobrem sorteio sem equipamento ou alvo, ativação fora do alcance, exclusão do próprio cofre, deduplicação por varredura e instrução no HUD.","—"],["EXP-08","Recolhimento Extraordinário (MIS-N32)","IMPLEMENTADO","Gameplay.ts, PersonalAgenda.test.ts, PlenaryMatch.test.ts, gameplay.test.ts, mission-row.test.tsx","A missão registra o ID da maleta no roubo e confirma o depósito parcial da mesma maleta roubada durante o objetivo. A Tesouraria oferece entregar tudo ou metade, arredondada para baixo ao milhar. O teste contábil verifica o saldo físico, o saldo depositado e a conservação do total. O HUD mostra as duas etapas.","—"],["EXP-09","Poupança Institucional e Pauta Prioritária (MIS-N33 e MIS-N77)","IMPLEMENTADO","PersonalAgenda.test.ts, mission-row.test.tsx","Poupança conta o aumento líquido da carteira desde o sorteio. Pauta usa a fase em que o presente foi aceito. Os testes cobrem dinheiro anterior, despesas, ganhos fracionários, aceite após início da votação e apresentação no HUD.","—"],["EXP-10","Segurança Parlamentar (MIS-N59)","IMPLEMENTADO","Gameplay.ts, PersonalAgenda.test.ts, mission-row.test.tsx","Cronometra dez segundos junto ao mesmo parlamentar elegível com Porrete equipado. Trocar de alvo, atacar ou desconectar zera a sequência. Teste usa compra, equipamento, combate e tick reais. O HUD mostra a condição e o tempo confirmado pelo servidor.","—"],["EXP-11","Plantão de Emergência (MIS-N66)","IMPLEMENTADO","PlenaryMatch.test.ts, Power.multiplayer.test.ts, mission-row.test.tsx","O gameserver exige participar da resolução dentro da sala afetada. Incêndio exige extintor. Pane elétrica exige concluir a operação de um dos painéis. O HUD exibe as duas alternativas.","—"],["EXP-12","Reunião de Alto Nível (MIS-N71)","IMPLEMENTADO","Gameplay.ts, installations.ts, PersonalAgenda.test.ts, mission-row.test.tsx","Define a área VIP em torno de uma placa instalada. O gameserver mede quinze segundos contínuos junto do mesmo parlamentar na mesma área. O teste cobre sorteio sem placa, limite da área, retirada da placa, reinício e conclusão. O HUD mostra o local e o progresso.","—"],["EXP-13","Manutenção de Emergência (MIS-N63)","IMPLEMENTADO","Power.multiplayer.test.ts, mission-row.test.tsx","Sorteável em multiplayer. O reparo em dois painéis gera um evento privado por operador válido e concede 45 XP. Cancelar, sair de alcance ou apenas presenciar a pane não conclui a missão.","—"],["EXP-14","Presença Parlamentar e Debate Democrático (MIS-N02 e MIS-N78)","IMPLEMENTADO","Gameplay.ts, PhoneSession.ts, PersonalAgenda.test.ts, mission-row.test.tsx","A visita ao Plenário precisa começar e terminar na mesma articulação. Desconectar ou sair da fase invalida a entrada. O telefone exige 20 segundos na mesma chamada, com progresso do melhor tempo e XP concedido pelo gameserver.","—"]]</script>
<script>
const states = ['IMPLEMENTADO','PARCIAL','PENDENTE','SUBSTITUÍDO','NÃO VERIFICÁVEL'];
const elements = Object.fromEntries(['offline','stats','search','area','count','rows'].map(id=>[id,document.getElementById(id)]));
let items = JSON.parse(elements.offline.textContent);
let state = '';
const normalize = text => text.normalize('NFD').replace(/\p{Diacritic}/gu,'').toLowerCase();
function readMarkdown(markdown) {
  return markdown.split('\n').filter(line=>/^\| [A-Z]+-\d+ \|/.test(line))
    .map(line=>line.split('|').slice(1,-1).map(value=>value.trim()))
    .filter(row=>row.length===6 && states.includes(row[2]));
}
function update() {
  const query = normalize(elements.search.value.trim());
  const matches = items.filter(row=>(!state || row[2]===state) &&
    (!elements.area.value || row[0].startsWith(elements.area.value+'-')) &&
    normalize(row.join(' ')).includes(query));
  elements.count.textContent = matches.length+' de '+items.length+' itens';
  elements.rows.replaceChildren(...matches.map(([id,title,status,evidence,note,cost])=>{
    const row = document.createElement('tr');
    for (const value of [id,title,status,note]) row.insertCell().textContent = value;
    const details = document.createElement('details');
    const summary = document.createElement('summary');
    summary.textContent = 'Evidência'+(cost==='—' ? '' : ' · complexidade '+cost.toLowerCase());
    details.append(summary,evidence);
    row.lastElementChild.append(details);
    return row;
  }));
  for (const button of elements.stats.children) button.setAttribute('aria-pressed',String(button.dataset.state===state));
}
function initialize() {
  const areas = [...new Set(items.map(row=>row[0].split('-')[0]))];
  elements.area.replaceChildren(new Option('Todas as áreas',''),...areas.map(area=>new Option(area,area)));
  elements.stats.replaceChildren(...['',...states].map(status=>{
    const button = document.createElement('button');
    const count = document.createElement('strong');
    button.dataset.state = status;
    count.textContent = items.filter(row=>!status || row[2]===status).length;
    button.append(count,status || 'TODOS');
    button.onclick = ()=>{ state = state===status ? '' : status; update(); };
    return button;
  }));
  update();
}
elements.search.addEventListener('input',update);
elements.area.addEventListener('change',update);
initialize();
if (location.protocol==='http:' || location.protocol==='https:') {
  fetch('gameplay-backlog.md',{cache:'no-store'}).then(async response=>{
    if (!response.ok) return;
    const current = readMarkdown(await response.text());
    if (current.length) { items = current; initialize(); }
  }).catch(()=>{});
}
</script>
