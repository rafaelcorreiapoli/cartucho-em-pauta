<script id="offline" type="application/json">[["SYS-01","Inicialização e encerramento de partidas","IMPLEMENTADO","SessionRoom.ts, PlenaryMatch.ts, SessionRoom.test.ts, game-audio.ts; PR 8, 11, 15","—","—"],["SYS-02","Lobby e gerenciamento de participantes","IMPLEMENTADO","SessionRoom.ts, PlenaryMatch.ts, SessionRoom.test.ts, game-audio.ts; PR 8, 11, 15","—","—"],["SYS-03","Quantidade mínima e máxima de jogadores humanos","IMPLEMENTADO","SessionRoom.ts, PlenaryMatch.ts, SessionRoom.test.ts, game-audio.ts; PR 8, 11, 15","O padrão exige seis humanos e limita a sala a seis. A prévia usa SESSAO_PREVIEW_SOLO=1. Um teste no Chrome iniciou uma partida publicada com um humano e zero NPCs.","—"],["SYS-04","Seleção de personagens antes da partida","IMPLEMENTADO","SessionRoom.ts, PlenaryMatch.ts, SessionRoom.test.ts, game-audio.ts; PR 8, 11, 15","—","—"],["SYS-05","Sincronização multiplayer em tempo real","IMPLEMENTADO","SessionRoom.ts, PlenaryMatch.ts, SessionRoom.test.ts, game-audio.ts; PR 8, 11, 15","—","—"],["SYS-06","Reconexão e recuperação do estado","IMPLEMENTADO","SessionRoom.ts, PlenaryMatch.ts, SessionRoom.test.ts, game-audio.ts; PR 8, 11, 15","—","—"],["SYS-07","Autoridade do servidor sobre regras de gameplay","IMPLEMENTADO","SessionRoom.ts, PlenaryMatch.ts, SessionRoom.test.ts, game-audio.ts; PR 8, 11, 15","—","—"],["SYS-08","Sistema de eventos de domínio","PARCIAL","SessionRoom.ts, PlenaryMatch.ts, SessionRoom.test.ts, game-audio.ts; PR 8, 11, 15","Eventos tipados de gameplay alimentam missões e economia. Atividades de sala, auditoria, emenda e campanha agora alimentam a Agenda pelo fluxo de eventos tipados. Transferências liquidadas alimentam a Agenda com um identificador do servidor. Testes cobrem o reenvio do mesmo evento sem progresso duplicado, inclusive após reposição da missão. O evento de protocolo usa a identidade do documento para bloquear reentrega à pauta e à Agenda, inclusive em outra rodada. Testes cobrem reentrega após duas votações e preservação da pauta válida. O fluxo WebSocket aceita um documento novo e rejeita novo protocolo do mesmo item, mesmo com token válido em outra rodada. O teste do HUD renderiza a pauta a partir do estado do gameserver e confirma que o documento repetido não aumenta o contador. A deduplicação ocorre antes dos efeitos econômicos do evento. Teste de regressão confirma que repetir uma instalação de pizza anterior ao escândalo não habilita progresso na Pizzada e que uma nova instalação após o escândalo permite concluir a missão. O teste integrado de hud-model.test.ts projeta o snapshot do servidor e confirma que o evento repetido não atualiza a Agenda nem concede XP. A instalação válida conclui a missão e atualiza a Agenda uma vez. A cobertura não é uniforme entre domínios. Eventos produzidos pelo gameserver agora recebem uma identidade sequencial própria. Um replay é descartado antes de atualizar pauta, Corregedoria e Agenda. PlenaryMatch.test.ts verifica a distinção entre replay e duas emissões no mesmo instante. hud-model.test.ts confirma dois depósitos parciais da mesma maleta no mesmo tick e um único prêmio de conclusão. SessionRoom usa a confirmação do despachante antes de notificar NPCs e clientes. O teste WebSocket reenvia um evento de depósito e confirma apenas um sinal de caixa no socket do jogador correto, seguido de um evento distinto. A descoberta de um dispositivo emite um evento por jogador e dispositivo físico, inclusive após recuperação e reinstalação. Reinspecionar após Deixar instalado ou reconectar restaura a opção de remoção sem reemitir descoberta. Gameplay.test.ts confirma uma única emissão e distingue a instalação substituta no mesmo esconderijo. A troca de partida passou a rejeitar eventos da partida anterior e publicações feitas por um contexto antigo. PlenaryMatch.test.ts confirma que um protocolo atrasado não captura o ID de um documento da nova partida. hud-model.test.ts verifica que um café atrasado não altera a Agenda nem concede XP e que a ação válida na nova partida funciona. A missão de publicar uma selfie deduplica o prêmio pelo ID da foto entre Imprensa e Correio Interno, preservando o evento de publicação no Correio para Jornalismo. Os testes de Agenda, HUD e WebSocket cobrem republicação cruzada, nova foto elegível e ausência de XP duplicado. Contextos de uma partida encerrada também ficam impedidos de alterar carteira, orçamento, XP, repasses de NPC ou o livro-caixa da partida seguinte. Eles deixam de gerar IDs aceitos na nova partida. PlenaryMatch.test.ts verifica as operações bloqueadas e hud-model.test.ts confirma que a carteira, o orçamento, o XP e a Agenda preservam o snapshot após solicitações atrasadas. A liquidação do Pix identifica o canal no próprio evento de transferência e contabiliza todos os efeitos da Agenda antes de repor missões. hud-model.test.ts comprova que um Pix que conclui Receba Dinheiro não credita Dois Pix recém-sorteada, e que dois envios posteriores de autores distintos concluem a missão. No Correio, uma publicação com foto própria emite um evento com a identidade do comunicado e a foto. A Agenda calcula todos os créditos antes de repor a lista e preserva a deduplicação por foto e canal. mission-row.test.tsx confirma que Jornalismo entra com zero após a missão de anexo e só conclui com uma nova foto, além de verificar a deduplicação de selfie entre canais. A entrega presencial de dinheiro usa o evento de transferência confirmado com o valor real para o remetente. PersonalAgenda.test.ts verifica os eventos dos dois jogadores, o valor exato e a recusa da repetição. O comando Pix não carrega opção de visibilidade. A economia registra o canal Pix como privado e o teste WebSocket verifica aviso só ao destinatário e acesso ao registro pela auditoria. A apuração guarda abstenções explícitas e parlamentares sem voto separadamente. Histórico e resumo usam os números do gameserver, inclusive quando alguém altera o voto antes do encerramento. A transferência de itens entre humanos registra o recebimento privado após a confirmação, independentemente da missão ativa. O evento inclui o slot final em que o item entrou, inclusive quando é incorporado a uma pilha. Os testes verificam rejeição de reenvio sem segundo evento, pilha resultante e 35 XP no HUD da Agenda após os dois lados concluírem a troca. O gameserver encerra o Snake no comando de fechar o celular. PhoneSession.test.ts confirma um único evento de encerramento em reenvios, bloqueio de início com celular fechado e ausência de tempo de missão ou XP por jogadas atrasadas. O Snake só emite tempo de missão após a primeira direção válida. Um tick atrasado credita apenas o intervalo até o limite da rodada. PhoneSession.test.ts cobre a espera com tabuleiro aberto, a direção proibida e os 30 ms finais. O fim da partida invalida eventos e mutações econômicas mesmo antes de abrir outra sessão. hud-model.test.ts verifica que callbacks anteriores e posteriores ao encerramento não alteram a Agenda final, XP, carteira ou orçamento. O evento de compra de voto de NPC inclui parlamentar, projeto e valor pago. O teste integrado verifica débito e consumo de cota, conclusão no HUD com XP e ausência de novo crédito após repetir a oferta ou reenviar o evento após sortear a missão novamente. A Tesouraria verifica o saldo exibido da maleta antes de aceitar o comando do HUD. O teste integrado rejeita a segunda entrega da mesma cotação sem alterar o caixa, a maleta ou a Agenda. Uma entrega com o saldo atualizado continua a contar no mesmo tick. O teste WebSocket da sala usa os saldos do inventário recebido pelo cliente para gerar o comando parcial. Dois tokens distintos com a mesma cotação geram uma única entrega, orçamento correto e um único SFX privado. A entrega atualizada liquida o resto.","Média"],["SYS-09","Interações contextuais com objetos e personagens","IMPLEMENTADO","SessionRoom.ts, PlenaryMatch.ts, SessionRoom.test.ts, game-audio.ts; PR 8, 11, 15","—","—"],["SYS-10","Interações canalizadas com duração e interrupção","IMPLEMENTADO","SessionRoom.ts, PlenaryMatch.ts, SessionRoom.test.ts, game-audio.ts; PR 8, 11, 15","—","—"],["SYS-11","Sistema global de notificações","IMPLEMENTADO","SessionRoom.ts, PlenaryMatch.ts, SessionRoom.test.ts, game-audio.ts; PR 8, 11, 15","—","—"],["SYS-12","Controle de fases e temporizadores da partida","IMPLEMENTADO","SessionRoom.ts, PlenaryMatch.ts, SessionRoom.test.ts, game-audio.ts; PR 8, 11, 15","—","—"],["SYS-13","Configurações centralizadas de balanceamento","PARCIAL","SessionRoom.ts, PlenaryMatch.ts, SessionRoom.test.ts, game-audio.ts; PR 8, 11, 15, PersonalAgenda.test.ts, mission-row.test.tsx, legislative-station-actions.test.tsx, PlenaryMatch.test.ts","As estações agora compartilham raio, oclusão e exigência de mãos livres entre cliente e servidor, com testes em ambos. Duração do Raio X, binóculo e megafone, redução de dano do colete e cura do kit usam a mesma configuração na interface e na mecânica. Nocaute, proteção, recuperação de PV e atordoamento usam a configuração do domínio médico. O teste de combate cobre o contador autoritativo e a proteção após socorro. HUD, socorro, inspeção e transporte usam a mesma regra de alcance para personagens nocauteados. Loja e servidor compartilham o catálogo por vendedor e o preço de cada produto. Testes cobrem listagem, preço e rejeição em vendedor incorreto. As descrições das ferramentas de arrombamento usam a força aplicada no servidor. O HUD e o gameserver compartilham a estabilidade inicial, o limite e a taxa de déficit. A meta visual usa o mesmo valor no medidor, no popover e na notificação. Testes cobrem a troca de cor e o arredondamento de déficit fracionário em votação. Missões cronometradas usam a mesma duração no sorteio, nos títulos e no progresso do HUD. O teste de jogo oculto verifica progresso até o limite e conclusão sem contar amostras repetidas. O teste de interface confere as três missões cronometradas. Outros valores locais ainda estão em revisão. O porrete usa a mesma duração para a animação do cliente e a recarga do servidor. O teste da investida cobre a direção e o segmento de impacto. O catálogo compartilhado calcula as cotações subsidiadas da loja e da Agenda. O cliente, o gameserver e a elegibilidade de missões usam a mesma taxa de publicação do Correio. Os textos da votação compartilham com o gameserver os parâmetros de desconto, duração, taxa de convocação, cura, peso eleitoral e bônus da Tesouraria. project-impact.test.tsx verifica desconto e cura exibidos, Foundations.test.ts verifica a cura real e o intervalo entre aplicações, e PlenaryMatch.test.ts verifica expiração e saldo. Todas as missões cronometradas agora usam no HUD a duração configurada no gameserver. Chamadas Urgentes compartilha duração e número de contatos entre sorteio, progresso e descrição. PersonalAgenda.test.ts cobre falta de contatos e o limite por chamada. mission-row.test.tsx cobre a instrução e o contador de contatos. fire-notice.test.tsx confere que o Incendiário só acende ao atingir o tempo de pavio informado no catálogo. A descrição da Pinga usa os valores da cura e da lentidão do consumível. A do Megafone informa duração e recarga a partir da configuração de equipamento. gameplay.test.ts verifica os textos, PlenaryMatch.test.ts verifica o fim da lentidão no passo previsto e Foundations.test.ts verifica o limite de transmissão e a recarga no gameserver. Chamadas Urgentes e Herói Inesperado usam os mesmos limites no gameserver e no texto da Agenda. PlenaryMatch.test.ts verifica que estabilidade baixa sem crise não basta, que o limite é exclusivo e que apagar um incêndio válido concede XP uma única vez. PersonalAgenda.test.ts verifica duração por ligação; mission-row.test.tsx confere os limites renderizados. A Corregedoria mostra a taxa condicional da Transparência Seletiva usando a mesma função de custo do gameserver. O teste integrado aprova ou rejeita a lei, verifica que a dica pública não muda quando surge uma transferência privada, confere a cobrança apenas na descoberta e confirma a retirada da dica após a expiração. O quórum de afastamento vem no snapshot do gameserver e é usado pelo HUD. O cálculo de maioria é compartilhado entre afastamento, cassação e votação de projeto, preservando as regras de cada uma. PlenaryMatch.test.ts testa rejeição com um voto abaixo do quórum e aprovação no limite. ballot.test.tsx renderiza o quórum, a participação e o voto privado a partir de um snapshot real e verifica a compatibilidade com snapshots anteriores. A cassação usa a mesma validação de voto no placar e na apuração. Os testes do gameserver e da renderização React cobrem a saída do alvo, a redução do eleitorado e o descarte da seleção. O teste do servidor cobre ainda a reconexão e a preservação da abstenção explícita. O preço e a disponibilidade financeira da Enfermaria vêm do snapshot do gameserver. O botão fica desabilitado e sem atalho quando falta saldo. Foundations.test.ts verifica que carteiras vazias não curam nem soltam o paciente e que o saldo exato paga o atendimento. treatment-action.test.ts verifica a projeção no HUD e a compatibilidade com snapshots antigos. A recarga do Raio X compartilha limite e preço entre HUD e gameserver. Gameplay.test.ts usa o modelo do HUD sobre o snapshot de um Raio X equipado e verifica ausência da ação longe do vendedor e com carga cheia, desabilitação sem saldo e retirada do atalho. O mesmo teste confirma que só a recarga válida restaura as cargas e cobra. As missões de Pix e Entrega de Cafezinho compartilham seus valores entre regras e HUD. PlenaryMatch.test.ts verifica que o Pix exige saldo suficiente no sorteio, um valor menor não concede crédito e o valor exato conclui a missão. mission-row.test.tsx confirma o valor e a quantidade apresentados no cliente. O tamanho do grupo na Reunião Pública é compartilhado pelo sorteio, pela contagem autoritativa de presença e pela descrição. O teste integrado verifica que um colega desconectado impede o sorteio e a contagem, e que o grupo completo rende 45 XP após o tempo configurado. A Campanha de Última Hora compartilha a janela com o HUD. O teste integrado verifica o limite exato e um milissegundo fora dele. O valor mínimo aceito no Pix, o saldo e a exigência de valor inteiro usam a mesma validação no telefone, no protocolo, na economia e no sorteio de remetentes. A cédula indica o déficit previsto e usa a fórmula de financiamento e penalidade da apuração. O teste integrado verifica R$ 33 mil de déficit e +12 de estabilidade na cédula e na apuração de um projeto com orçamento insuficiente. As consultas de preço da Agenda para lanchonete, credenciais e kit médico usam o mesmo catálogo que valida a compra. Loja e gameserver consultam a mesma regra de capacidade. O teste integrado cobre mochila cheia, lanche empilhável, pizza sem empilhamento, compra por diálogo e equipamento automático no catálogo direto. A configuração da pauta centraliza os 30 segundos de aviso e os 5 segundos de bloqueio. O snapshot do gameserver informa o aviso somente quando a votação ainda cabe no tempo da partida. O limite de 60 segundos do Snake está na configuração do jogo e começa na primeira direção aceita. O Chrome verifica que a seta oposta mantém a tela pronta e que uma direção válida permite coletar frutas. O prazo para protocolar usa a duração configurada da articulação e da votação e considera a reabertura do Protocolo. As metas financeiras de Ostentação, Contribuinte e Reserva do Cofre são compartilhadas pelo texto da missão e pelo gameserver. A soma usa precisão de R$ 1 mil. O teste integrado verifica Tesouraria e cofre com valores fracionários, a meta exibida, um pagamento a menos sem prêmio e o crédito de XP ao completar o valor exato. A Tesouraria e a Agenda compartilham o valor mínimo de uma maleta que admite entrega parcial. O teste integrado verifica a ausência da opção abaixo do mínimo e executa a ação oferecida pelo HUD no valor exato, confirmando a conclusão com XP.","Baixa"],["SYS-14","Proteção contra duplicação e concorrência de comandos","IMPLEMENTADO","room-commands.ts, SessionRoom.ts, SessionRoom.test.ts, Documents.multiplayer.test.ts, politics-panel.test.ts","Comandos de gameplay e lobby compartilham sequência por sessão, preservada na reconexão. Movimento e atributos mantêm sequência e revisão próprias. Compras ainda validam o token do diálogo e posse. Testes de socket cobrem fotos, ataques, Raio X, câmera, publicação, votos e pagamentos repetidos.","—"],["SYS-15","Observabilidade, logs e métricas de gameplay","IMPLEMENTADO","SessionRoom.ts, PlenaryMatch.ts, SessionRoom.test.ts, game-audio.ts; PR 8, 11, 15","Além dos logs de economia e XP, o gameserver exporta contadores agregados de início, fim, reconexão e divergências no formato Prometheus. O Prometheus do Fly coletou o contador de partidas iniciadas da prévia solo com valor 1, confirmado também no endpoint /metrics. Testes cobrem leitura via HTTP após partida real e registro de divergência sem identificar salas nas métricas. O gameserver mede intervalos acima de 100 ms entre ticks e processamento síncrono acima de 50 ms em salas ativas. Testes verificam os limiares e a exposição HTTP após partida real. Na prévia solo do Fly, após o ajuste de rede, o Chrome registrou até 119 ms entre frames WebSocket andando; no intervalo observado, o gameserver registrou 443 ticks e zero lacunas acima de 100 ms. Teste de reconexão real exige incremento único no contador. Um teste WebSocket com a lotação máxima confirma a entrada de todos na partida, o reconhecimento de oito comandos de movimento por cliente e o avanço dos ticks no endpoint /metrics. Na prévia af74993 do Fly em São Paulo, seis clientes WebSocket sem NPCs enviaram 960 comandos em cerca de oito segundos. O tempo entre envio e confirmação foi de 92 ms na mediana, 120 ms no p95 e 166 ms no máximo. Os contadores agregados registraram 160 ticks em repouso e 167 durante o envio, sem lacunas acima de 100 ms nem trabalho síncrono acima de 50 ms. Este teste mede confirmação de rede, sem renderização no navegador. Um teste com seis clientes encerra a partida por desconexões após injetar crédito sem origem e confirma um único log estruturado de divergência e um único incremento no contador, mesmo após a saída dos demais clientes. Alertas de divergência ficam disponíveis no log estruturado e na métrica coletada pelo Fly. A entrega em canal externo não faz parte deste item.","—"],["SYS-16","Tratamento consistente de desconexões definitivas","IMPLEMENTADO","SessionRoom.ts, PlenaryMatch.ts, SessionRoom.test.ts, game-audio.ts; PR 8, 11, 15","—","—"],["SYS-17","Persistência do estado durante a partida","IMPLEMENTADO","SessionRoom.ts, PlenaryMatch.ts, SessionRoom.test.ts, game-audio.ts; PR 8, 11, 15","A reconexão preserva o estado enquanto a sala está ativa. Socket verifica XP, agenda, carteira e equipamento. A revisão de movimento invalida comandos anteriores a teletransportes e reconexões, e o cliente limita a previsão à capacidade da fila do servidor. O pathfinding reduz os trechos retos a pontos de mudança de direção antes de testar atalhos. Uma regressão cobre o percurso completo do gabinete sudeste até a Antecâmara. Testes simulam atraso e confirmações em lotes sem recuo da posição prevista e verificam por WebSocket que todos os comandos de uma fila cheia são confirmados em ordem. O Colyseus simula a 20 Hz com passo fixo e recuperação limitada de ticks atrasados. Confirmações continuam a 20 Hz. A projeção visual e privada roda a 10 Hz, com envio imediato na troca de fase, e as mensagens de cada tick são agrupadas em um frame WebSocket. Testes de socket cobrem a ordem de confirmações, visibilidade, troca de fase, chamadas e reconexão. O cliente interpola personagens remotos com 200 ms de buffer. Teste cobre posições intermediárias com chegada irregular e ocultação.","—"],["SYS-18","Testes automatizados de regras de gameplay","IMPLEMENTADO","SessionRoom.ts, PlenaryMatch.ts, SessionRoom.test.ts, game-audio.ts; PR 8, 11, 15","—"," umano nominal","IMPLEMENTADO","PersonalAgenda.ts, photo-missions.ts, politics.ts, Documents.multiplayer.test.ts, hud.tsx; PR 12, 15","Assinatura verificada por socket com três clientes. Testes integrados cobrem entrega de pizza e documento, transferência, visita e selfie, inclusive jogador errado com mesmo nome. HUD testado para os seis tipos.","—"],["MIS-05","Missões de assinatura","IMPLEMENTADO","PersonalAgenda.ts, photo-missions.ts, politics.ts, Documents.multiplayer.test.ts, hud.tsx; PR 12, 15","—","—"],["MIS-06","Missões de entrega de objetos","IMPLEMENTADO","PersonalAgenda.ts, photo-missions.ts, politics.ts, Documents.multiplayer.test.ts, hud.tsx; PR 12, 15","—","—"],["MIS-07","Missões financeiras","IMPLEMENTADO","PersonalAgenda.ts, photo-missions.ts, politics.ts, Documents.multiplayer.test.ts, hud.tsx; PR 12, 15","—","—"],["MIS-08","Missões de compra e consumo","IMPLEMENTADO","PersonalAgenda.ts, photo-missions.ts, politics.ts, Documents.multiplayer.test.ts, hud.tsx; PR 12, 15","—","—"],["MIS-09","Missões de exploração","IMPLEMENTADO","PersonalAgenda.ts, photo-missions.ts, politics.ts, Documents.multiplayer.test.ts, hud.tsx; PR 12, 15","—","—"],["MIS-10","Missões de fotografia","IMPLEMENTADO","PersonalAgenda.ts, photo-missions.ts, politics.ts, Documents.multiplayer.test.ts, hud.tsx; PR 12, 15","—","—"],["MIS-11","Missões de decoração","IMPLEMENTADO","PersonalAgenda.ts, photo-missions.ts, politics.ts, Documents.multiplayer.test.ts, hud.tsx; PR 12, 15","—","—"],["MIS-12","Missões de atividades ociosas","IMPLEMENTADO","PersonalAgenda.ts, photo-missions.ts, politics.ts, Documents.multiplayer.test.ts, hud.tsx; PR 12, 15","—","—"],["MIS-13","Missões com duração","IMPLEMENTADO","PersonalAgenda.ts, photo-missions.ts, politics.ts, Documents.multiplayer.test.ts, hud.tsx; PR 12, 15","—","—"],["MIS-14","Condições compostas e progresso parcial","IMPLEMENTADO","PersonalAgenda.ts, photo-missions.ts, politics.ts, Documents.multiplayer.test.ts, hud.tsx; PR 12, 15","—","—"],["MIS-15","Missões condicionadas à visibilidade","IMPLEMENTADO","PersonalAgenda.ts, photo-missions.ts, politics.ts, Documents.multiplayer.test.ts, hud.tsx; PR 12, 15","—","—"],["MIS-16","Seleção de objetivos realmente elegíveis","PARCIAL","PersonalAgenda.ts, photo-missions.ts, politics.ts, Documents.multiplayer.test.ts, hud.tsx; PR 12, 15","Regras filtram participantes, mandatos e ciclos. Alvos isolados são substituídos em missões de contato. Sorteio verifica saldo para compras e pagamentos definidos, evita TV já comprada, exige mandato para protocolo e exclui selfie com cargo inexistente. Gabinete trancado permanece elegível via negociação ou arrombamento; teste exige entrada efetiva. Diplomacia de Gabinete preserva a visita já registrada quando o dono sai da partida, desde que ainda exista outro gabinete válido. PersonalAgenda.test.ts cobre perda do alvo restante, visita repetida e jogador sem gabinete. mission-row.test.tsx usa entradas registradas pelo gameserver e verifica 1/2 após a saída, conclusão e 35 XP. Sorteio usa inventário e equipamento reais para alimentos e binóculo. Pizzada exige escândalo público antes do sorteio; teste cobre a mudança de elegibilidade. Missões de mobília verificam slots e orçamento no sorteio. A meta de gastos exige uma combinação pagável dos móveis disponíveis. Teste com compras reais cobre a redução do estoque, e o HUD exibe progresso de gastos em reais. Missões de instalação de retrato e placa VIP verificam saldo e inventário, com teste de compra e instalação. O sorteio de missões coletivas desconta participantes em isolamento, preserva o progresso em missões coletivas já ativas e continua permitindo visitas a gabinetes. Autorretrato verifica retrato instalado, em inventário ou comprável. Fiscalização VIP exige placa de outro parlamentar e participantes suficientes para fotógrafo, dono e visitante. Testes cobrem a exclusão em dupla e a conclusão com uma foto real do visitante. O HUD indica quem deve sair na foto. A elegibilidade de missões de votação considera a pauta protocolada. Testes cobrem sorteio, dois votos em sequência e progresso no HUD. Missões de transferência respeitam o limite de pagamentos e voltam ao sorteio após renovação da rodada. O cliente também bloqueia o envio sem pagamentos disponíveis. Missões de recebimento só são sorteadas se houver colegas disponíveis com saldo e cota suficientes. Teste cobre saldo zerado, renovação da cota e dois remetentes distintos. Propaganda e discurso saem do sorteio após uso no ciclo e voltam após renovação. Teste integrado cobre o ciclo e conclusão da propaganda. O sorteio também verifica se ainda é possível apresentar emenda, com teste de bloqueio e conclusão na articulação seguinte. Substituição de retrato ou placa exige uma instalação alheia ou um local que o jogador acabou de liberar. Teste cobre retirada, reinstalação e conclusão da missão VIP. Quedas de conexão excluem o contato do sorteio e substituem missões de contato que apontavam para ele. O teste preserva a agenda do jogador desconectado durante o prazo de retorno. O sorteio de duas assinaturas conta apenas colegas disponíveis e NPCs signatários, excluindo o autor. O teste cobre reposição com um NPC e preservação de progresso durante indisponibilidade temporária. Quando faltam signatários humanos, o sorteio também verifica o custo total das assinaturas de NPCs e a cota de pagamentos. Um teste solo verifica o bloqueio sem saldo ou cota, a reentrada após renovação e a conclusão com duas assinaturas no mesmo documento. O HUD foi testado com progresso de um e dois signatários. Assinaturas de jogadores que saíram continuam válidas no documento original. PersonalAgenda.test.ts verifica preservação do progresso e reposição quando faltam novos signatários. mission-row.test.tsx verifica três assinaturas reais após a saída de um signatário e os 65 XP. Compra de voto de NPC só entra no sorteio com votação restante, pagamento disponível e uma cotação paga ao alcance do saldo. Testes comparam a cotação do sorteio com as regras da negociação. Roubo de NPC só é sorteado quando algum parlamentar NPC tem saldo. Teste usa saque e transferência reais para verificar saída e retorno ao sorteio. Em partidas acima de seis humanos, missões de cofre e decoração própria exigem gabinete atribuído e visitas exigem um gabinete real. O teste usa oito jogadores e verifica substituição de missões inviáveis. O sorteio distingue comprar de instalar: uma TV no inventário permite a missão de instalação mesmo sem saldo para outra compra. O teste retira e reinstala a TV pelo fluxo de gameplay e verifica a conclusão. Fotos excluem jogadores desconectados durante o prazo de retorno. A missão de fotografar alguém jogando aceita Antecâmara e Comissões, como indica o HUD. Testes de captura, regra da missão e renderização cobrem esses casos. A missão de escândalo exige prova inédita contra terceiros. Auditoria ou recebimento da prova libera o sorteio, e a publicação por outra pessoa substitui a missão se não restar prova elegível. Testes cobrem a disputa pela mesma prova e a descrição no HUD. Missões de servir pizza consideram fatias de uma pizza já instalada pelo jogador e convidados disponíveis que ainda não receberam. A Pizzada exige instalação após escândalo. Teste cobre compra, instalação e consumo de fatias. Uma fatia disponível no Cafezinho permite sortear e concluir a missão de comer pizza mesmo sem saldo, inclusive se outro jogador instalou a pizza. O teste do servidor usa compra, instalação e consumo reais e confirma que o mesmo jogador não recebe a missão novamente com base na fatia já consumida. O teste do HUD confirma que a missão indica a opção de pegar uma fatia. NPCs não substituem destinatários humanos na seleção de missões coletivas e de transferência. Testes usam ofertas e aceites reais de café e verificam destinatários distintos, exclusão de jogador desconectado e conclusão após três entregas. O teste do HUD verifica progresso e conclusão. Missões de Pix verificam cota de envio e remetentes solventes com pagamentos disponíveis. O gameserver preserva o Pix já recebido após a saída do remetente quando ainda existe outro jogador capaz de completar a missão. PlenaryMatch.test.ts cobre cota esgotada, saldo insuficiente, repetição do remetente e saída após crédito. mission-row.test.tsx renderiza a lista privada do gameserver com a missão indisponível ausente e progresso de zero até conclusão. Investigação Particular só recebe crédito depois do primeiro quadro enviado pelo gameserver. Gameplay.test.ts verifica a emissão por seleção, e mission-row.test.tsx confirma ausência de progresso na abertura, deduplicação após reinstalar e conclusão com outro aparelho. Presença Parlamentar exige entrar e sair durante a mesma articulação. Votação de projeto, cassação ou afastamento interrompe a visita em curso. mission-row.test.tsx verifica a volta do Plenário sem XP e a conclusão com 25 XP após uma visita válida. Outros objetivos dependentes de disponibilidade no mapa seguem em revisão. Testes do PlenaryMatch e do HUD verificam que a última cédula não volta a oferecer a mesma missão depois que o voto já contou. Votar contra ainda permite registrar apoio ao mudar o voto para favorável. Limpeza Institucional só entra no sorteio após uma descoberta privada de dispositivo alheio. Pode ser concluída sem Detector após a descoberta. Se outro jogador remover o último alvo conhecido, a Agenda repõe a missão. Varredura exige outro jogador elegível. As missões de café usam a cafeteira gratuita com saldo zero. Gameplay.test.ts e mission-row.test.tsx cobrem instalação, descoberta privada, remoção concorrente e consumo, usando o estado autoritativo. A Agenda usa preços vigentes de móveis, equipamentos e publicação no Correio. Compras múltiplas deduzem o subsídio de cada item antes de cotar o próximo. Ostentação progride pelo débito do jogador. Testes cobrem orçamento insuficiente, expiração do desconto e compra real de TV por R$ 18 mil após votação, com o mesmo valor no HUD. O sorteio e a reposição também consideram os prazos. O Correio mantém missões durante uma recarga que termina antes do fim da sessão e as substitui quando a próxima publicação já não cabe no prazo. Campanha de Última Hora sai do HUD ao esgotar a última propaganda. mission-row.test.tsx usa publicações e campanhas autoritativas para conferir o limite da recarga, o corte de 60 s, XP e reposição. O HUD recebe o progresso autoritativo de Varredura: redescobrir o mesmo aparelho, mesmo após reinstalar e receber a missão novamente, não concede XP. A descoberta ainda libera a remoção, validada no fluxo integrado de mission-row.test.tsx. Em Chamadas Urgentes, o gameserver mantém o crédito de uma ligação concluída mesmo após a saída do contato. O teste integrado atende duas ligações via PhoneSession e confirma 1/2 no HUD após a saída de quem já contou e 45 XP ao concluir. PersonalAgenda.test.ts verifica reposição quando saem contatos ainda necessários. As missões de ligação contabilizam apenas o tempo em que os dois participantes estão presentes e conscientes. PhoneSession.test.ts verifica a pausa em ausência e a retomada sem retroativo. mission-row.test.tsx usa uma chamada real da simulação para conferir o HUD pausado durante nocaute e o crédito de 35 XP após retomar. Escuta Ativa mede o tempo desde a abertura do grampo ou a retirada do mute. O teste integrado em mission-row.test.tsx compra e instala o dispositivo, verifica um milissegundo de escuta na primeira amostra, pausa o progresso no mute e confirma 35 XP exatamente aos 15 segundos de monitoramento. Discurso Histórico passou a contar a última amostra válida da transmissão até o prazo do Megafone. mission-row.test.tsx compra e ativa o equipamento, mantém 9,95 s no HUD antes do fim e verifica que um tick atrasado credita somente os 50 ms faltantes para concluir e conceder 35 XP. A Agenda verifica se ainda existe uma cadeira reservável antes de oferecer Reserva ou Privilégio Adquirido. mission-row.test.tsx compra placas no Credenciamento, ocupa as quatro cadeiras, verifica a exclusão das missões, libera uma cadeira e conclui a reserva pelo fluxo real do gameserver. O HUD preserva Fiscalização Paralela durante a reconexão do dono do cofre e repõe a missão sem XP se o último cofre rival sair da partida. Flagrante de Gabinete aceita a visita ao gabinete do fotógrafo. mission-row.test.tsx usa snapshots do PlenaryMatch, gabinetes reais e uma captura de foto para verificar os dois fluxos. A missão de receber dinheiro de duas pessoas preserva um remetente já creditado se ele sair e ainda houver outro participante para completar o objetivo. Pagamentos repetidos do mesmo remetente mantêm 1/2. O HUD usa o progresso do gameserver e o teste verifica conclusão com XP ou reposição sem recompensa se o único remetente restante sair. Bandeja Gourmet exige acesso a dois alimentos distintos. O café gratuito da estação cobre um deles. O segundo precisa estar no inventário ou caber no saldo. PersonalAgenda.test.ts cobre saldo zero, inventário e gabinete. mission-row.test.tsx compra coxinha na Lanchonete, coleta café e verifica que o consumo fora do gabinete não conta. O HUD avança a 1/2 no gabinete e o gameserver concede 35 XP ao completar. As missões de selfies e de servir fatias preservam o progresso dos colegas já contabilizados quando eles saem da partida. A Agenda repõe o objetivo se faltarem colegas ainda inéditos. Os testes do gameserver e do HUD incluem selfies reais, fotos repetidas, compra e instalação de pizza, saída do primeiro convidado e conclusão com o seguinte. Solenidade de Inauguração só entra no sorteio com retrato rival recém-instalado e ainda sem rabisco. O gameserver reavalia a missão quando o retrato é marcado, retirado ou ultrapassa 60 s. PersonalAgenda.test.ts cobre o limite exato e a exclusão do dono. mission-row.test.tsx valida compra, instalação, disputa entre dois visitantes, reposição sem XP para quem perdeu o alvo e prêmio de 30 XP para quem rabiscou. Escuta Ativa preserva o progresso quando o grampo é recuperado e pode ser reinstalado. Após remoção definitiva, a Agenda verifica esconderijo disponível, inventário e preço vigente de reposição. Testes do gameserver cobrem o tempo preservado e a reposição da missão. O HUD acompanha recuperação, reinstalação e perda do último grampo sem saldo, sem conceder XP adicional. Investigação Particular preserva o progresso se ainda houver câmeras físicas inéditas suficientes. O gameserver distingue aparelhos já creditados, inclusive após recuperação, e considera esconderijos, inventário e custo de reposição. Testes do servidor e do HUD cobrem preservar 1/2, conclusão com outro aparelho e reposição sem XP quando a única câmera inédita é removida e não pode ser substituída. A missão de publicar uma selfie pode ser sorteada a partir de uma foto própria já salva, mesmo com os retratados desconectados. A Agenda valida a existência de um canal ainda utilizável, o preço do Correio e o histórico de crédito da foto. Testes de gameserver e HUD confirmam publicação com participantes offline, 30 XP, o bônus de popularidade +4 e ausência de novo sorteio usando a mesma selfie. Manutenção de Emergência só entra no sorteio durante uma pane elétrica. Ao restaurar a energia, a participação nos dois painéis é creditada antes de repor as missões ainda abertas. PlenaryMatch.test.ts simula corte, reparo e ausência de recompensa para quem ficou de fora. mission-row.test.tsx verifica a missão no HUD e os 45 XP após o reparo. A Pizzada preserva a fatia já servida quando o convidado deixa a partida se a mesma pizza ainda consegue atender os convidados restantes. PersonalAgenda.test.ts cobre saída de convidado ainda não servido, substituição da pizza e falta de fatias. hud-model.test.ts compra e instala a pizza pelo Gameplay, remove o convidado do PlenaryMatch e verifica a conclusão e o XP no snapshot do HUD. Entrega de Cafezinho mantém o crédito por destinatário que já aceitou a xícara e deixa a partida. O gameserver repõe a missão sem prêmio se faltarem destinatários inéditos para concluir. PersonalAgenda.test.ts cobre os dois casos com transferências reais, e hud-model.test.ts confirma a preservação de 1/3, a conclusão posterior e o XP no snapshot do HUD. Reunião Pública e Reunião de Gabinete contabilizam somente o intervalo em que havia colegas humanos ativos na mesma sala nas duas amostras. A reconexão ou a entrada de um colega não credita o intervalo anterior. mission-row.test.tsx cobre ausência, retorno à conexão, troca de sala e conclusão pelo snapshot autoritativo. Escuta Ativa usa a mesma regra no sorteio e na revalidação. Aceita grampo já instalado ou instalação viável com item em mãos ou saldo para o preço vigente. Os testes cobrem rejeição sem saldo ou esconderijo e mostram no HUD a mesma missão do sorteio antes da compra até a conclusão com 15 segundos de escuta. A capacidade de votação da Agenda usa o relógio da partida, o intervalo de protocolo, a articulação, a duração da votação e eventuais audiências. O teste integrado verifica que a missão de dois projetos sai do HUD quando só cabe uma votação, enquanto a missão de um voto continua jogável e recebe crédito. Investimento Político desconta janelas de propaganda que venceram durante uma votação, mesmo se a renovação eleitoral ainda estiver pendente. O teste integrado cruza o prazo durante a votação e verifica a substituição da missão no HUD quando as propagandas restantes não atingem a meta. Fiscalização Paralela e Patrimônio Suspeito exigem Raio X com carga, varredura em curso ou saldo para recarga. O teste integrado usa o equipamento comprado e equipado, mantém a missão na última varredura, confirma a reposição sem XP ao expirar e verifica que o saldo exato torna a missão elegível novamente. Bandeja Gourmet considera a Pinga já recebida como consumível disponível. O teste integrado aprova Minha Pinga, Minha Vida, confirma que a missão passa a ser sorteável com carteira zerada e verifica a conclusão no HUD e os 35 XP após consumir café e Pinga no gabinete. A Agenda considera tanto a recarga do Correio quanto as janelas de votação, afastamento e cassação que adiam a publicação. Os testes de afastamento no fim da partida verificam a remoção sem XP quando não sobra tempo, a preservação quando o Correio reabre antes do prazo e a publicação real com anexo que concede 35 XP. A elegibilidade do Correio considera a cassação definitiva e o instante exato de retorno do afastamento. Testes com audiência e votos reais preservam a missão dos demais jogadores e verificam os dois lados do limite de tempo para o jogador afastado, sem prêmio na reposição. Recolhimento Extraordinário exige que um NPC tenha saldo suficiente para uma entrega parcial. O teste integrado diferencia R$ 1 mil, que habilita o roubo simples, de R$ 2 mil, que habilita também o Recolhimento. O HUD mostra 1/2 após o roubo, mantém a missão com o NPC já sem saldo e confirma a conclusão com 60 XP após a entrega parcial. A Agenda revalida a maleta específica após roubo, entrega e embolso. O teste integrado verifica que entregar o valor inteiro remove o objetivo inviável sem XP, e que um novo roubo com entrega parcial conclui a missão. Jogadores cassados saem da lista usada pela Agenda. Um teste integrado encerra uma votação de cassação, confirma que Dois Pix sai do HUD quando sobra apenas um remetente e que enviar R$ 20 mil ao colega restante ainda dá 25 XP. O gameserver recusa o Pix para o jogador cassado. O teste também cobre a cassação de um remetente já creditado: o HUD mantém 1/2 e o segundo Pix concede 30 XP. Nos dois casos, o aplicativo Pix renderiza apenas o colega elegível, usando o snapshot do gameserver. A lista de destinatários do Pix usa a mesma regra do gameserver para autorizar o remetente. O teste integrado confirma que a votação de cassação esconde os destinatários sem consumir cota e que, após a votação, o aplicativo volta a listar os colegas para quem ainda pode transferir. A missão de em
