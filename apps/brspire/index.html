<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141d1d" />
    <meta name="description" content="Monte seu baralho e enfrente figuras da política brasileira neste roguelike de cartas." />
    <link rel="stylesheet" href="/src/loading.css" />
    <title>Cartas Marcadas — Roguelike de cartas</title>
  </head>
  <body>
    <main id="loading" class="hud-loading" aria-labelledby="loading-title">

    <div id="app" hidden></div>
    <script type="module" src="/src/main.ts"></script>
