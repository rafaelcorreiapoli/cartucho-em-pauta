<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Presidente da Sessão</title>
</head>
<body>
  <main>
    <header>
      <h1>Presidente da Sessão</h1>
      <p>Protótipo multiplayer · Até 6 jogadores</p>
    </header>
    <form id="lobby">
      <button id="create" type="button">Criar sala</button>
      <label>Código da sala <input id="room-id" maxlength="64" autocomplete="off" required></label>
      <button type="submit">Entrar</button>
    </form>
    <details id="voice-test" hidden>
      <summary>Testar filtro de voz</summary>
      <div class="voice-test-controls">
        <label>Voz
          <select id="voice-model">
            <option value="disfarce">Disfarce genérico</option>
            <option value="original">Voz original</option>
            <option value="lula">Lula (atual)</option>
            <option value="lula-alternativo">Lula (alternativo)</option>
            <option value="bolsonaro">Bolsonaro (atual)</option>
            <option value="bolsonaro-alternativo">Bolsonaro (alternativo)</option>
          </select>
        </label>
        <label>Ajuste
          <select id="voice-profile">
            <option value="natural">Mais suave</option>
            <option value="classic">Anterior</option>
          </select>
        </label>
        <button id="voice-record" type="button">Gravar frase</button>
        <button id="voice-convert" type="button" disabled>Aplicar à gravação</button>
      </div>
      <p id="voice-test-status" role="status"></p>
      <audio id="voice-result" controls hidden aria-label="Gravação com filtro"></audio>
    </details>
    <div id="connection" role="status"></div>
    <section id="session" hidden>
      <div id="room-bar">
        <button id="invite" type="button">Copiar link</button>
        <button id="leave" type="button">Sair</button>
      </div>
      <div id="voice-bar" aria-label="Voz da sala">
        <button id="voice-toggle" type="button">Ativar voz</button>
        <button id="voice-leave" type="button" hidden>Sair da voz</button>
        <span id="voice-status" role="status"></span>
        <span id="voice-speaking"></span>
      </div>
      <div id="characters" role="group" aria-label="Personagem"></div>
      <div id="map" tabindex="0" aria-label="Mapa do Congresso"></div>
      <p>WASD, setas ou toque no chão pra andar.</p>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
