<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Infiltrados no Congresso</title>
</head>
<body>
  <svg class="hud-symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><symbol id="icon-shield" viewBox="0 0 24 24"><path d="M12 22s7-3 7-9V5l-7-3-7 3v8c0 6 7 9 7 9z"/><path d="m9 12 2 2 4-4"/></symbol><symbol id="icon-salary" viewBox="0 0 24 24"><path d="M5 3h14v18l-3-2-4 2-4-2-3 2V3zM8 7h8M8 11h8M12 15h4"/></symbol><symbol id="icon-star" viewBox="0 0 24 24"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.9-6.2-3.3-6.2 3.3L7 14.2 2 9.3l6.9-1z"/></symbol><symbol id="icon-bug" viewBox="0 0 24 24"><path d="m9 7-2-3m8 3 2-3M6 11l-3-2m15 2 3-2M6 15H3m15 0h3m-15 3-3 2m15-2 3 2"/><rect x="6" y="7" width="12" height="14" rx="6"/><path d="M12 11v10M6 11h12"/></symbol><symbol id="icon-wallet" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M16 10h5v4h-5a2 2 0 0 1 0-4Z"/></symbol><symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol><symbol id="icon-ballot" viewBox="0 0 24 24"><path d="M4 11h16l2 3v6H2v-6zm4-2 4-6 5 3-4 5M8 15h8"/></symbol><symbol id="icon-map" viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zm6-3v15m6-12v15"/></symbol><symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></symbol><symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol><symbol id="icon-cross" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol><symbol id="icon-coffee" viewBox="0 0 24 24"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9Zm13 1h2a2 2 0 1 1 0 4h-2M3 22h16M8 3v3m5-3v3"/></symbol><symbol id="icon-phone" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M10 18h4"/></symbol><symbol id="icon-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11v1a7 7 0 0 0 14 0v-1m-7 8v3"/></symbol><symbol id="icon-document" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zm8 0v5h4M9 12h6m-6 4h6"/></symbol><symbol id="icon-alert" viewBox="0 0 24 24"><path d="m12 3 10 17H2zm0 6v5m0 2v1"/></symbol><symbol id="icon-chart" viewBox="0 0 24 24"><path d="M4 4v16h16M8 15l4-5 3 3 5-7"/></symbol></svg>
  <svg class="hud-symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-handset" viewBox="0 0 24 24"><path d="m7 3 3 5-2.5 2a12 12 0 0 0 6.5 6.5l2-2.5 5 3v2a2 2 0 0 1-2 2A18 18 0 0 1 3 5a2 2 0 0 1 2-2z"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><path d="m10 3-.7 2.4-1.6.9-2.5-.5-2 3.4L5 11v2l-1.8 1.8 2 3.4 2.5-.5 1.6.9.7 2.4h4l.7-2.4 1.6-.9 2.5.5 2-3.4L19 13v-2l1.8-1.8-2-3.4-2.5.5-1.6-.9L14 3z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="icon-inventory" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V4h8v3M3 13h18m-11-1v3h4v-3"/></symbol>
    <symbol id="icon-app-call" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2 2a13 13 0 0 0 4 4l2-2 5 2v4c0 1-1 2-2 2A17 17 0 0 1 3 6c0-1 1-2 2-2Z"/><path d="M15 4c2 0 4 2 4 4"/></symbol>
    <symbol id="icon-app-games" viewBox="0 0 24 24"><path d="M7 7h10a4 4 0 0 1 4 3l1 5a2 2 0 0 1-3 2l-3-2H8l-3 2a2 2 0 0 1-3-2l1-5a4 4 0 0 1 4-3Z"/><path d="M6 11h5m-2.5-2.5v5m7-3h.01m2.5 2.5h.01"/></symbol>
    <symbol id="icon-app-camera" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="4"/><circle cx="12" cy="12" r="3.5"/><path d="M17 8h.01"/></symbol>
    <symbol id="icon-app-photos" viewBox="0 0 24 24"><path d="M7 3h13a1 1 0 0 1 1 1v13"/><rect x="3" y="7" width="14" height="14" rx="2"/><circle cx="8" cy="11" r="1"/><path d="m4 18 4-3 2 2 3-4 4 4"/></symbol>
    <symbol id="icon-snake" viewBox="0 0 24 24"><path d="M4 19h7a3 3 0 0 0 0-6H8a3 3 0 0 1 0-6h7"/><rect x="14" y="4" width="7" height="6" rx="2"/><path d="M18 7h.01"/></symbol>
    <symbol id="icon-wifi" viewBox="0 0 24 24"><path d="M2 8a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0M8.5 16a5.5 5.5 0 0 1 7 0"/><circle cx="12" cy="20" r="1"/></symbol>
    <symbol id="icon-camera" viewBox="0 0 24 24"><path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  </svg>
  <main>
    <section id="landing">
      <div id="room-entrance" class="hud-panel entrance lobby-card"></div>
    </section>
    <details id="voice-test" hidden>
      <summary>Testar filtro de voz</summary>
      <div class="voice-test-controls">
        <label>Voz
          <select id="voice-model">
            <option value="disfarce">Disfarce genérico</option>
            <option value="original">Voz original</option>
            <option value="lula">Lula (atual)</option>
            <option value="lula-alternativo">Lula (alternativo)</option>
            <option value="bolsonaro">Bolsonaro (atual)</option>
            <option value="bolsonaro-alternativo">Bolsonaro (alternativo)</option>
          </select>
        </label>
        <label>Ajuste
          <select id="voice-profile">
            <option value="natural">Mais suave</option>
            <option value="classic">Anterior</option>
          </select>
        </label>
        <fieldset id="disguise-controls" hidden>
          <legend>Disfarce genérico</legend>
          <label for="disguise-pitch">Tom <output id="disguise-pitch-value" for="disguise-pitch">−4 semitons</output></label>
          <input id="disguise-pitch" class="hud-range" type="range" min="-12" max="12" step="1" value="-4">
          <label for="disguise-style">Timbre</label>
          <select id="disguise-style">
            <option value="preserved">Preservado</option>
            <option value="shifted">Alterado</option>
            <option value="radio">Rádio</option>
          </select>
        </fieldset>
        <button class="hud-button" id="voice-record" type="button">Gravar frase</button>
        <button class="hud-button" id="voice-convert" type="button" disabled>Aplicar à gravação</button>
      </div>
      <p id="voice-test-status" role="status"></p>
      <audio id="voice-result" controls hidden aria-label="Gravação com filtro"></audio>
    </details>
    <section id="session" data-phase="lobby" aria-label="Sala multiplayer" hidden>
      <dialog id="role-intro" aria-labelledby="role-intro-title" aria-describedby="role-intro-objective">
        <small>Seu papel secreto</small>
        <h2 id="role-intro-title"></h2>
        <p id="role-intro-objective"></p>
        <form method="dialog"><button class="hud-button" autofocus>Entendi</button></form>
      </dialog>
      <dialog id="ballot-countdown" aria-labelledby="ballot-countdown-message"></dialog>
      <div id="world">
        <div id="map" tabindex="0" aria-label="Mapa do Congresso"></div>
        <span id="connection-latency-mount"></span>
        <div id="wallet-effects" role="status"></div>
        <div id="megaphone-status"></div>
        <aside id="object-request" class="hud-panel" aria-label="Pedidos de jogadores" hidden></aside>
      </div>
      <div id="context-hud">
        <section id="stations" aria-label="Ações próximas" hidden>
          <div class="station-actions" id="context-actions-mount"></div>
        </section>
      </div>
      <div id="map-action-feedback" popover="manual" role="status"></div>
      <section id="plenary" class="hud-panel lobby-card" aria-label="Sessão legislativa">
        <div id="room-setup">
          <h2 class="lobby-brand"><img src="%BASE_URL%assets/logo-infiltrados.webp" alt="Infiltrados no Congresso"></h2>
          <p>Escolha seu personagem</p>
          <div id="lobby-invite-mount" class="lobby-invite"></div>
          <div id="characters" role="group" aria-label="Personagem"></div>
        </div>
        <div id="lobby-controls"></div>
      </section>
      <div id="match" hidden>
        <header id="command-strip" aria-label="Indicadores da partida">
          <div class="character-dock">
            <section id="profile-dock" aria-label="Seu personagem"></section>
            <div id="equipped-gear" role="list" aria-label="Equipamentos em uso" hidden></div>
          </div>
          <div id="congress-dock" class="hud-module"></div>
          <div class="right-hud">
            <div id="payroll-mount"></div>
            <div id="election-indicator-mount"></div>
            <div id="active-fire-mount"></div>
            <div id="active-outage-mount"></div>
            <div id="electoral-notice-mount"></div>
            <div id="hud-notices" role="status" aria-label="Eventos da sessão"></div>
          </div>
        </header>
        <div id="agenda-dock"></div>
        <footer id="command-deck" aria-label="Painel de partida">
          <section id="legislative-dock" aria-label="Situação legislativa"></section>
          <section class="deck-tools" aria-label="Itens e ferramentas">
            <div id="item-slots" role="group" aria-label="Itens carregados" hidden></div>
            <div class="deck-tool-row">
              <div id="congress-apps"></div>
            </div>
          </section>
        </footer>
      </div>
      <dialog id="room-settings" class="hud-panel sound-settings-content" aria-labelledby="settings-title"></dialog>
      <div id="asset-loading-mount"></div>
      <div id="floor-plan" hidden></div>
      <dialog id="campaign-picker" class="hud-panel" aria-labelledby="campaign-picker-title"></dialog>
      <dialog id="project-picker" class="hud-panel" aria-labelledby="project-picker-title"></dialog>
      <dialog id="result-dialog" class="hud-panel" aria-labelledby="result-title"></dialog>
      <dialog id="session-finale" aria-labelledby="session-finale-title"></dialog>
      <dialog id="dossier-dialog" class="hud-panel legislative-modal" aria-labelledby="dossier-title"><div id="dossier-content"></div></dialog>
      <dialog id="institutional-dialog" class="hud-panel legislative-modal" aria-labelledby="institutional-title"><div id="institutional-actions"></div></dialog>
      <dialog id="election-poll-dialog" class="hud-panel" aria-labelledby="election-poll-title"></dialog>
      <dialog id="market-dialog" class="hud-panel" aria-labelledby="market-title"></dialog>
      <dialog id="equip-purchase-dialog" class="hud-panel" aria-labelledby="equip-purchase-title" aria-describedby="equip-purchase-item"></dialog>
      <dialog id="action-shortcuts" class="hud-panel" aria-labelledby="action-shortcuts-title"></dialog>
      <dialog id="gameplay-dialog" class="hud-panel" aria-labelledby="gameplay-title">
        <header></header>
        <nav id="phone-apps" aria-label="Apps do celular" hidden></nav>
        <div id="gameplay-body"></div>
        <div id="phone-mail" class="phone-app-content" hidden></div>
      </dialog>
      <dialog id="surveillance-dialog" class="hud-panel" aria-labelledby="surveillance-title"></dialog>
      <dialog id="security-dialog" class="hud-panel" aria-labelledby="security-title"></dialog>
      <dialog id="level-up-dialog" class="progression-dialog" aria-labelledby="level-up-title"></dialog>
      <dialog id="parliamentarian-dialog" class="progression-dialog" aria-labelledby="parliamentarian-title"></dialog>
      <dialog id="attributes-dialog" class="progression-dialog" aria-labelledby="attributes-title"></dialog>
      <p id="movement-hint" class="hud-strip">WASD, setas ou toque para andar · Shift para correr</p>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
