[build]
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/jogar/brwars"
  to = "/jogar/base-aliada"
  status = 301

[[redirects]]
  from = "/jogar/brspire"
  to = "/jogar/cartas-marcadas"
  status = 301

[[redirects]]
  from = "/jogar/base-aliada"
  to = "/jogar/base-aliada.html"
  status = 200

[[redirects]]
  from = "/jogar/cartas-marcadas"
  to = "/jogar/cartas-marcadas.html"
  status = 200

[[redirects]]
  from = "/infiltrados-no-congresso/jogar"
  to = "/infiltrados-no-congresso/jogar.html"
  status = 200
