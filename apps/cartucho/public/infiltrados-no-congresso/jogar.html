<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172219">
  <meta name="description" content="Jogue Infiltrados no Congresso no Cartuchão.">
  <title>Jogar Infiltrados no Congresso | Cartuchão</title>
  <link rel="icon" href="/assets/cartucho.png">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #172219; }
    main { width: 100%; height: 100vh; height: 100dvh; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
  <script type="module">
    import { registerOpening } from '/ranking-api.js';
    registerOpening('sessao').catch(() => {});
  </script>
</head>
<body>
  <main class="player" data-game="sessao">
    <iframe title="Infiltrados no Congresso" src="https://presidente-sessao-poc--brwars.netlify.app/" allow="fullscreen; autoplay; microphone" allowfullscreen></iframe>
  </main>
  <script>
    const room = new URLSearchParams(location.search).get('sala');
    if (room) {
      const game = document.querySelector('iframe');
      const target = new URL(game.src);
      target.searchParams.set('sala', room);
      game.src = target.href;
    }
  </script>
</body>
</html>
